<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleydesk</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#1f2a44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Volleydesk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="societa.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f5f2ec; --surface:#ffffff; --surface-2:#faf8f4; --ink:#1f2a44; --ink-2:#4a5570; --muted:#7a8296;
  --line:#e3ddd2; --line-2:#d3cbbd; --accent:#e07b22; --accent-ink:#ffffff; --blue:#2f6fb8; --red:#d64a5a; --green:#22a05a;
  --sand:#f4d3a1; --radius:10px; --shadow:0 1px 2px rgba(31,42,68,.06),0 4px 14px rgba(31,42,68,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:15.5px}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bar);color:#fff;display:flex;align-items:center;gap:24px;padding:10px 24px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.7}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;color:#fff;opacity:.75;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600}
.nav button:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav button.on{opacity:1;background:rgba(255,255,255,.16)}
.spacer{flex:1}
.backup-pill{background:#f6c344;color:#3a2b00;border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}

/* layout */
main{max-width:1280px;margin:0 auto;padding:24px 24px 120px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{margin:4px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.dark{background:var(--bar);border-color:var(--ink);color:#fff}
.btn.danger{color:#b3263a}
.btn.danger:hover{border-color:#b3263a}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:rgba(31,42,68,.06)}
.btn.sm{padding:4px 10px;font-size:13px}
.iconbtn{background:none;border:1px solid transparent;border-radius:6px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2);font-size:15px}
.iconbtn:hover{background:rgba(31,42,68,.07);border-color:var(--line)}
.iconbtn:disabled{opacity:.3;cursor:default;background:none;border-color:transparent}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:14.5px;font-weight:400;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(224,123,34,.35);border-color:var(--accent)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g6{grid-template-columns:2fr 1fr 1fr .7fr .9fr 1.4fr}
@media (max-width:900px){.g2,.g3,.g6{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.g2,.g3,.g6{grid-template-columns:1fr}}
.span2{grid-column:span 2}
@media (max-width:560px){.span2{grid-column:auto}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h2{margin-bottom:12px}
.panel + .panel{margin-top:16px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.filters input[type=search]{max-width:320px}
.filters select{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip span{opacity:.55;font-weight:500;margin-left:2px}
.chip.on{background:var(--bar);color:#fff;border-color:var(--ink)}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{--c:var(--ink-2);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c) 13%,white);color:color-mix(in srgb,var(--c) 85%,black)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag.plain{background:#eef0f4;color:var(--ink-2)}
.tag.plain::before{display:none}

/* exercise cards */
.group-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.group-title:first-child{margin-top:0}
.group-title .bar{width:4px;height:18px;border-radius:2px;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,42,68,.08),0 10px 24px rgba(31,42,68,.1)}
.thumb{aspect-ratio:960/521;background:#e8ecf0;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:contain}
.thumb .noschema{font-size:13px;color:var(--muted)}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;color:var(--ink-2);font-size:13.5px}
.empty{padding:40px;text-align:center;color:var(--muted);border:2px dashed var(--line-2);border-radius:var(--radius)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,26,40,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal-box{background:var(--surface);border-radius:14px;max-width:900px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.modal-head h2{font-size:22px}
.modal-body{padding:0 22px 22px}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.detail-schema{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0 16px}
.detail-schema svg,.detail-schema img{display:block;width:100%}
.fields dt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--accent);margin-top:12px}
.fields dd{margin:2px 0 0}
.addto{display:flex;gap:6px;align-items:center;margin-left:auto}
.addto select{width:auto;max-width:240px;padding:6px 8px}

/* editor footer */
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(31,42,68,.08);padding:12px 24px;display:flex;justify-content:flex-end;gap:10px;z-index:15}
.savebar .msg{margin-right:auto;align-self:center;color:var(--muted);font-size:13.5px}

/* schema editor */
.sed{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);overflow:hidden}
.sed-tools{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--surface);align-items:stretch}
.tool{border:1px solid transparent;background:none;border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:64px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.tool svg{width:34px;height:24px}
.tool:hover{background:rgba(31,42,68,.06)}
.tool.on{background:#fff3e6;border-color:var(--accent);color:var(--ink)}
.tool-sep{width:1px;background:var(--line);margin:4px 4px}
.sed-main{display:grid;grid-template-columns:minmax(0,1fr) 240px}
@media (max-width:900px){.sed-main{grid-template-columns:1fr}}
.sed-canvas{padding:10px}
.sed-canvas svg{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.sed-canvas svg.placing{cursor:crosshair}
.sed-canvas svg .el{cursor:move}
.sed-canvas svg [data-h]{cursor:grab}
.sed-props{border-left:1px solid var(--line);padding:12px;background:var(--surface);font-size:13.5px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.sed-props{border-left:0;border-top:1px solid var(--line)}}
.sed-props h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sed-props .row{display:flex;gap:6px;flex-wrap:wrap}
.sed-hint{padding:7px 12px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);background:var(--surface)}
.kbd{font-family:inherit;font-size:11.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.schema-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px;border:2px dashed var(--line-2);border-radius:var(--radius);background:var(--surface-2);text-align:center}
.schema-img{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.schema-img img{display:block;width:100%}
.schema-img .row{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line);background:var(--surface-2);align-items:center}

/* sessions */
.sess-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.sess-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.sess-card:hover{border-color:var(--line-2)}
.sess-date{font-size:12.5px;text-transform:capitalize;color:var(--accent);font-weight:700}
.sess-meta{display:flex;gap:14px;color:var(--ink-2);font-size:13.5px}
.compbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eceae5}
.compbar span{display:block;height:100%}
.sess-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1000px){.sess-layout{grid-template-columns:1fr}}
.picker{position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.picker .plist{overflow:auto;margin:10px -6px 0;padding:0 6px}
.pitem{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.pitem .mini{aspect-ratio:960/521;border-radius:4px;overflow:hidden;background:#e8ecf0;border:1px solid var(--line)}
.pitem .mini svg,.pitem .mini img{width:100%;height:100%;display:block;object-fit:cover}
.pitem .t{font-size:13.5px;font-weight:600;line-height:1.25;cursor:pointer}
.pitem .t:hover{text-decoration:underline}
.pitem .s{font-size:12px;color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.items{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:grid;grid-template-columns:22px 86px minmax(0,1fr) auto;gap:12px;padding:10px 10px 10px 6px;align-items:start}
.item.free{background:var(--surface-2);border-style:dashed}
.item.dragging{opacity:.4}
.item.drop-before{box-shadow:0 -3px 0 var(--accent)}
.item.drop-after{box-shadow:0 3px 0 var(--accent)}
.handle{cursor:grab;color:var(--muted);display:grid;place-items:center;height:100%;font-size:16px;letter-spacing:-2px;user-select:none}
.item .when{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--ink-2)}
.item .mini{aspect-ratio:960/521;border-radius:5px;overflow:hidden;background:#e8ecf0;border:1px solid var(--line);margin-top:4px}
.item .mini svg,.item .mini img{width:100%;height:100%;display:block;object-fit:cover}
.item .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bar);color:#fff;font-size:12px;font-weight:700;margin-right:6px}
.item .ttl{font-weight:700;font-size:15px;cursor:pointer}
.item .ttl:hover{text-decoration:underline}
.item .controls{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dur{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.dur input{width:62px;padding:5px 6px;text-align:right}
.item textarea{min-height:38px;font-size:13.5px;padding:6px 8px;margin-top:6px}
.item input.free-title{font-weight:700;padding:5px 8px}
.summary{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.summary .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.summary .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend-row i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.printopts{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;align-items:center}
.printopts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.saved{font-size:12.5px;color:var(--green);font-weight:600}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bar);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.offline{position:sticky;top:58px;z-index:19;background:#b3263a;color:#fff;padding:10px 24px;font-weight:600;text-align:center}
.pathbox{font-family:Consolas,Menlo,monospace;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;word-break:break-all}
.warn{background:#fff6e0;border:1px solid #f0d58a;color:#5c4400;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}

/* atleti */
input[type=tel]{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:14.5px;font-weight:400;color:var(--ink);width:100%}
.span3{grid-column:1/-1}
.atable{width:100%;border-collapse:collapse;font-size:14px}
.atable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.atable td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.atable tbody tr:last-child td{border-bottom:0}
.atable tbody tr:hover{background:#fbfaf7}
.atable .nm{font-weight:700;cursor:pointer;white-space:nowrap}
.atable .nm:hover{text-decoration:underline}
.atable .sub{font-size:12px;color:var(--muted);font-weight:400}
.atable .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.atable tr.off td{color:var(--muted)}
.atable input[type=checkbox]{width:18px;height:18px;cursor:pointer}
.atable a{color:inherit}
.bday{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.bday.soon{background:#ffe9cc;color:#8a4a00;border:1px solid #f5b25c}
.bday.today{background:#d8f5e3;color:#11633a;border:1px solid #5cc58a}
.bday-banner{background:#fff4e5;border:1px solid #f5c98a;border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bday-banner .bday{cursor:pointer}
.scad{white-space:nowrap;font-variant-numeric:tabular-nums}
.scad.soon{color:#8a5a00;font-weight:700}
.scad.late{color:#b3263a;font-weight:700}
.navbadge{display:inline-block;background:#f6c344;color:#3a2b00;border-radius:999px;font-size:11.5px;padding:0 7px;margin-left:4px;font-weight:700}
.ro{background:var(--surface-2)!important;color:var(--ink-2)!important}
.ro-box{min-height:39px;display:flex;align-items:center;font-weight:400;color:var(--ink)}
.sw{display:flex;align-items:center;gap:8px;min-height:39px;font-weight:600;color:var(--ink);cursor:pointer}
.sw input{width:18px;height:18px}

/* partite */
.match-list{display:flex;flex-direction:column;gap:10px}
.match{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;cursor:pointer}
.match:hover{border-color:var(--ink-2)}
.match.past{background:var(--surface-2)}
.mdate{text-align:center;border-right:1px solid var(--line);padding-right:14px}
.mdate .wd{font-size:12px;text-transform:uppercase;color:var(--accent);font-weight:700}
.mdate .dd{font-size:26px;font-weight:800;line-height:1.1}
.mdate .mm{font-size:12.5px;color:var(--ink-2);text-transform:uppercase}
.match h3{font-size:16px}
.mmeta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:13.5px;margin-top:4px}
.ha{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.ha.casa{background:#dff3e6;color:#1d6b3c}
.ha.trasf{background:#e3ecf8;color:#24538f}
.next-pill{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px;margin-left:6px;vertical-align:2px}
.mside{text-align:right;font-size:13.5px;white-space:nowrap}
.mside .res{font-size:20px;font-weight:800}
.conv-ok{color:var(--green);font-weight:700}
.conv-no{color:#b06a00;font-weight:700}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ctable tr.sel{background:#fff7ee}
.ctable tr.off td{color:var(--muted)}
.ctable .num{width:44px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.ctable input[type=checkbox]{width:18px;height:18px;cursor:pointer}
.ctable label{cursor:pointer}
.cwarn{color:#b3263a;font-size:12.5px;font-weight:600}
.wa-text{font-size:13.5px;min-height:300px;flex:1;background:#f0faf3!important;border-color:#bfe3cb!important}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .btn{justify-content:center}

/* presenze */
details.panel > summary{cursor:pointer;list-style:none}
details.panel > summary::-webkit-details-marker{display:none}
details.panel > summary::before{content:"▸";display:inline-block;width:18px;color:var(--muted)}
details.panel[open] > summary::before{content:"▾"}
.daypick{display:flex;flex-wrap:wrap;gap:8px}
.dayopt{display:flex;flex-direction:column;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:10px;padding:8px;background:var(--surface);min-width:104px}
.dayopt.on{border-color:var(--accent);background:#fff7ee}
.dayopt label{display:flex;gap:6px;align-items:center;font-weight:700;cursor:pointer}
.dayopt input[type=checkbox]{width:16px;height:16px}
.dayopt input[type=time]{padding:4px 6px;font-size:13px;width:96px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav h2{margin:0;min-width:180px;text-align:center;text-transform:capitalize}
.regwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:70vh}
.reg{border-collapse:separate;border-spacing:0;font-size:14px;width:100%}
.reg th,.reg td{border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap;background:var(--surface)}
.reg thead th{background:var(--surface-2);font-size:12px;color:var(--ink-2);position:sticky;top:0;z-index:2;vertical-align:bottom}
.reg tfoot td{background:var(--surface-2);font-size:13px;font-weight:700;position:sticky;bottom:0}
.reg .sticky{position:sticky;left:0;z-index:1;text-align:left;border-right:1px solid var(--line)}
.reg thead .sticky,.reg tfoot .sticky{z-index:3}
.reg .n{text-align:right;font-variant-numeric:tabular-nums}
.reg .pc{text-align:center;padding:3px 4px}
.thbtn{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;font-size:11.5px;color:var(--ink-2);padding:3px 5px;border-radius:6px;margin:auto;text-transform:capitalize}
.thbtn:hover{background:rgba(31,42,68,.08)}
.thbtn b{font-size:13.5px;color:var(--ink)}
.thbtn span{font-size:11px;color:var(--muted);text-transform:none}
th.today .thbtn{background:#fff3e6;box-shadow:0 0 0 1px var(--accent)}
th.canc .thbtn b{text-decoration:line-through;color:var(--muted)}
.pbtn{width:34px;height:30px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:800;font-size:15px;color:#b9bec9;line-height:1}
.pbtn:hover{border-color:var(--ink-2)}
.pbtn.sP{background:#dff3e6;border-color:#7cc99a;color:#1d6b3c}
.pbtn.sA{background:#fde4e7;border-color:#e9a0aa;color:#b3263a}
.pbtn.sG{background:#fff1d6;border-color:#f0c56b;color:#8a5a00}
td.canc{color:var(--muted);text-align:center;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 4px,#f0f0f0 4px,#f0f0f0 8px)!important}
.absb{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.absb.ok{color:var(--green)}
.absb.mid{color:#b06a00}
.absb.bad{color:#b3263a}
.dots{display:inline-flex;gap:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#d8dbe2}
.dot.dP{background:#2c9a5a}
.dot.dA{background:#d64a5a}
.dot.dG{background:#e0a020}
.legend-p{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.ctable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}

/* avatar atleti */
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;vertical-align:middle;margin-right:7px;line-height:1;box-shadow:0 0 0 1px rgba(31,42,68,.08)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.ini{color:#fff;font-weight:700;letter-spacing:.02em}
.av.emo-av{background:#f1efe9}
.avpick{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.avpick .av{margin:0}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-top:10px;max-width:520px}
.emo{font-size:22px;background:var(--surface);border:1px solid var(--line);border-radius:8px;height:40px;cursor:pointer;padding:0}
.emo:hover,.emo.on{border-color:var(--accent);background:#fff7ee}

/* pagine larghe (atleti, presenze) */
body.wide main{max-width:none}
.atable{font-size:13.5px}
.atable th{padding:9px 8px;white-space:normal;line-height:1.25;vertical-align:bottom}
.atable td{padding:8px 8px}
.atable .bday,.atable .scad{font-size:12.5px}
.atable .av{margin-right:6px}
.paste-hint{font-size:12.5px;color:var(--muted)}

/* adatta immagine allo schema */
.fit-cv{display:block;width:100%;height:auto;border:1px solid var(--line-2);border-radius:8px;cursor:grab;background:var(--surface);touch-action:none}
.fit-cv.drag{cursor:grabbing}
.fit-row{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.fit-row input[type=range]{width:240px;vertical-align:middle;accent-color:var(--accent)}
.fit-row #fit-pct{display:inline-block;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* esercizi fisici: serie e ripetizioni */
.seg{display:flex;gap:8px 18px;flex-wrap:wrap;margin-bottom:12px;font-weight:600;font-size:14.5px}
.seg label{display:flex;gap:7px;align-items:center;cursor:pointer}
.seg input{width:17px;height:17px;accent-color:var(--accent)}
.g-dos{grid-template-columns:.7fr 1.6fr 1fr 1.1fr 1.4fr}
@media (max-width:900px){.g-dos{grid-template-columns:1fr 1fr}}
.dos-sum{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.idos{margin-top:6px;font-size:13px;color:var(--ink-2);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.idos input{width:58px;padding:3px 6px;text-align:right;font-size:13px}
.idos .iconbtn{width:26px;height:26px}

/* sincronizzazione */
.sync-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.sync-pill:hover{background:rgba(255,255,255,.18)}
.sync-pill i{width:9px;height:9px;border-radius:50%;background:#9aa1b0;flex:none}
.sync-pill.ok i{background:#4ad48a}
.sync-pill.pending i{background:#f6c344}
.sync-pill.syncing i{background:#6fb3ff;animation:pulse 1s infinite}
.sync-pill.offline i{background:#9aa1b0}
.sync-pill.error{background:#b3263a}
.sync-pill.error i{background:var(--surface)}
.sync-pill.off i{background:#f6c344}
@keyframes pulse{50%{opacity:.3}}
.sync-box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface-2);display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.sync-box .st{font-weight:700}
.sync-box .st.error{color:#b3263a}
.sync-box .st.ok{color:var(--green)}
.steps{margin:6px 0 14px;padding-left:22px}
.steps li{margin:6px 0}
.steps code,.mono{font-family:Consolas,Menlo,monospace;font-size:13px;background:#eef0f4;border-radius:4px;padding:1px 5px}
input[type=password]{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:14.5px;font-weight:400;color:var(--ink);width:100%}
.welcome{max-width:760px;margin:20px auto}
.choice{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;margin-top:12px;text-align:left;width:100%}
.choice:hover{border-color:var(--accent)}
.choice .ic{font-size:26px;line-height:1}
.choice b{display:block;font-size:16px;margin-bottom:2px}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:120;background:var(--bar);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.nav .ni{display:none}
a.btn{text-decoration:none;color:inherit}
.at-cards{display:flex;flex-direction:column}
.atc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.atc:last-child{border-bottom:0}
.atc.off{opacity:.6}
.atc .av{margin:0}
.atc .nm{font-weight:700;font-size:15.5px;cursor:pointer}
.atc .meta{font-size:13px;color:var(--ink-2)}
.atc .badges{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-2)}
.atc .badges b{font-weight:600;color:var(--muted)}
.atc .iscr{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.atc .iscr input{width:20px;height:20px}

/* ---------- TELEFONO ---------- */
@media (max-width:760px){
  body{font-size:15px}
  .topbar{gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
  .brand{font-size:15.5px;gap:8px}
  .brand small{display:none}
  .brand svg{width:26px;height:26px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);display:grid;grid-template-columns:repeat(7,1fr);gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.18)}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:10px;font-size:10.5px;font-weight:600;opacity:.7;min-width:0}
  .nav button.on{background:rgba(255,255,255,.14)}
  .nav .ni{display:block;font-size:19px;line-height:1.15}
  .nav .nl-x{display:none}
  .navbadge{position:absolute;margin:0 0 0 22px;font-size:10px;padding:0 5px}
  .nav button{position:relative}
  .sync-pill{padding:5px 10px;font-size:12px;flex:none}
  .brand{min-width:0;flex:1;overflow:hidden}
  .brand>div{overflow:hidden;text-overflow:ellipsis}
  .topbar .spacer{display:none}
  html{overflow-x:clip}
  .sess-layout{grid-template-columns:minmax(0,1fr)!important}
  .sess-layout>*,.grid>*{min-width:0}
  .presets .btn{white-space:normal}
  main{padding:14px 12px calc(150px + env(safe-area-inset-bottom))}
  h1{font-size:22px}
  .page-head{margin-bottom:12px;gap:10px}
  .page-head .actions{width:100%}
  .panel{padding:14px}
  .filters{gap:8px}
  .filters input[type=search]{max-width:none;width:100%}
  .filters select{flex:1;min-width:0}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -12px;padding-left:12px;padding-right:12px;-webkit-overflow-scrolling:touch}
  .chip{flex:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card-body{padding:9px 10px 11px}
  .card-body h3{font-size:14px}
  .card .clamp{display:none}
  .modal{padding:0;display:block;overscroll-behavior:contain;background:var(--surface)}
  .modal-box{border-radius:0;min-height:100%;max-width:none!important;box-shadow:none;display:flex;flex-direction:column}
  .modal-box>.modal-body{flex:1}
  html:has(#modal:not(.hidden)),body:has(#modal:not(.hidden)){overflow:hidden}
  .modal-head{padding:14px 14px 10px;position:sticky;top:0;background:var(--surface);z-index:2;padding-top:calc(14px + env(safe-area-inset-top))}
  .modal-head h2{font-size:19px}
  .modal-body{padding:0 14px 16px}
  .modal-foot{border-radius:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));position:sticky;bottom:0}
  .addto{margin-left:0;width:100%;flex-wrap:wrap}
  .addto select{flex:1 1 100%;max-width:none}
  .addto .btn{flex:1 1 100%;justify-content:center}
  .savebar{bottom:calc(58px + env(safe-area-inset-bottom));padding:10px 12px;flex-wrap:wrap}
  .savebar .msg{width:100%;margin:0}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom));max-width:92vw;text-align:center;border-radius:14px}
  .update-bar{bottom:calc(76px + env(safe-area-inset-bottom));max-width:94vw}
  .picker{position:static;max-height:none}
  .picker .plist{max-height:60vh}
  .item{grid-template-columns:62px minmax(0,1fr);gap:8px;padding:10px}
  .item .handle{display:none}
  .item .controls{grid-column:1/-1;flex-direction:row;justify-content:flex-end;flex-wrap:wrap}
  .sess-list{grid-template-columns:1fr}
  .match{grid-template-columns:58px minmax(0,1fr);gap:10px;padding:10px 12px}
  .mdate{padding-right:8px}
  .mdate .dd{font-size:22px}
  .mside{grid-column:1/-1;text-align:left;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .mside .res{font-size:17px}
  .sed-tools{overflow-x:auto;flex-wrap:nowrap}
  .tool{min-width:56px}
  .reg{font-size:13px}
  .reg th,.reg td{padding:4px 5px}
  .pbtn{width:32px;height:30px}
  .regwrap{max-height:none}
  .monthnav h2{min-width:0;font-size:16px}
  .daypick{gap:6px}
  .dayopt{min-width:88px}
  .bday-banner{font-size:13.5px}
  .g-dos{grid-template-columns:1fr 1fr}
  .fit-row input[type=range]{width:100%}
  .wa-text{min-height:200px}
  .sync-box{flex-direction:column;align-items:flex-start}
}


/* formazione, rotazioni, statistiche */
.fslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.fslots{grid-template-columns:1fr 1fr}}
.fslot{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.fslot i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.rotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
@media (max-width:760px){.rotgrid{grid-template-columns:1fr}}
.rotcard{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.rotcard h3{margin:0 0 6px;font-size:15px}
.rotpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rotpair .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:center}
.rotpair svg{width:100%;height:auto;display:block}
.live-top{position:sticky;top:58px;z-index:12;background:var(--bar);color:#fff;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;box-shadow:var(--shadow)}
@media (max-width:760px){.live-top{top:52px}}
.live-top .sc{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live-top .sc small{font-size:13px;font-weight:600;opacity:.75;margin:0 6px}
@media (max-width:760px){.live-top{padding:6px 10px;gap:4px 10px}.live-top .sc{font-size:22px}.live-top .btn{padding:3px 8px}.serve{font-size:12.5px;padding:2px 8px}.abtn{padding:9px 4px;font-size:13.5px}.actgrid{grid-template-columns:1fr 1fr;gap:8px}}
.live-top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.live-top select{width:auto;padding:4px 6px;font-size:13px}
.live-sets{font-size:12.5px;opacity:.8}
.serve{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;background:#f6c344;color:#3a2b00;border-radius:999px;padding:3px 10px}
.serve.them{background:rgba(255,255,255,.18);color:#fff}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:2px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px 5px 5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:14px}
.pchip.court{border-color:#9fb6d6}
.pchip.on{border-color:var(--accent);background:#fff3e6;box-shadow:0 0 0 2px rgba(224,123,34,.25)}
.pchip .nr{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--bar);color:#fff;font-size:12px}
.pchip.court .nr{background:#2f6fb8}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.actbox{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.actbox h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.actbox .row{display:flex;flex-wrap:wrap;gap:6px}
.abtn{flex:1 1 auto;min-width:62px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:10px 6px;font-weight:800;font-size:14px;cursor:pointer;touch-action:manipulation}
.abtn.g{background:#dff3e6;border-color:#7cc99a;color:#1d6b3c}
.abtn.y{background:#fff1d6;border-color:#f0c56b;color:#8a5a00}
.abtn.r{background:#fde4e7;border-color:#e9a0aa;color:#b3263a}
.abtn:active{transform:scale(.97)}
.abtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1}
.abtn .asym{font-size:22px;font-weight:900;letter-spacing:-1px}
.abtn .acap{font-size:10.5px;font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.evlist{font-size:13.5px;display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.evlist div{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.evlist .sc2{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.stt{font-size:13px}
.stt th{white-space:nowrap}
.stt td.n,.stt th.n{text-align:right;font-variant-numeric:tabular-nums}


/* stampa compatta della sessione */
.pc{--pz:1;font-size:calc(8.6pt * var(--pz));line-height:1.3;color:#111}
.pc .p-head{padding-bottom:calc(4pt * var(--pz));margin-bottom:calc(5pt * var(--pz));border-bottom-width:1.5pt}
.pc .p-head h1{font-size:calc(15pt * var(--pz));margin:1pt 0 2pt}
.pc .p-meta{font-size:1em;gap:2pt 10pt}
.pc .p-box{margin:calc(3pt * var(--pz)) 0;padding:calc(3pt * var(--pz)) 6pt;font-size:1em}
.pc table.p-sched{font-size:.95em;margin:calc(4pt * var(--pz)) 0 calc(6pt * var(--pz))}
.pc table.p-sched td,.pc table.p-sched th{padding:calc(1.5pt * var(--pz)) 4pt}
.pcx-grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(5pt * var(--pz)) 6pt}
.pcx{border:.8pt solid #c8c8c8;border-radius:4pt;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
.pcx.wide{grid-column:1/-1}
.pcx-h{display:flex;align-items:center;gap:5pt;background:#f1efe9;padding:calc(2.5pt * var(--pz)) 6pt;border-bottom:.8pt solid #d6d6d6}
.pcx-h b{font-size:1.1em;line-height:1.15;flex:1}
.pcx-h .pex-num{min-width:calc(14pt * var(--pz));height:calc(14pt * var(--pz));font-size:.95em}
.pcx-t{font-size:.9em;color:#555;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pcx-m{font-size:.9em;color:#444;padding:calc(2pt * var(--pz)) 6pt 0}
.pcx-b{padding:calc(3pt * var(--pz)) 6pt calc(4pt * var(--pz))}
.pcx-s{width:calc(100% * var(--pz));margin:0 auto calc(3pt * var(--pz))}
.pcx-s svg,.pcx-s img{width:100%;display:block;border:.5pt solid #ccc;border-radius:2pt}
.pcx-b p{margin:0 0 calc(2pt * var(--pz))}
.pcx-b p b{color:#b85f12}
.pcx-n{margin:0 6pt calc(4pt * var(--pz));background:#fff4e2;border-left:2.5pt solid #e07b22;padding:2pt 5pt;font-size:.95em}
.pc .p-notes{font-size:.9em;margin-top:calc(6pt * var(--pz));columns:2;column-gap:10pt}
.pc .p-notes h3{font-size:1.05em;column-span:all}
.pc .p-footer{margin-top:4pt;font-size:.8em}


/* ---------- TELEFONO IN ORIZZONTALE ---------- */
@media (orientation: landscape) and (max-height: 520px){
  html{overflow-x:clip}
  body{padding-left:calc(64px + env(safe-area-inset-left));padding-right:env(safe-area-inset-right)}
  .topbar{position:fixed;left:0;top:0;bottom:0;width:calc(64px + env(safe-area-inset-left));flex-direction:column;align-items:stretch;gap:4px;padding:6px 4px 6px calc(4px + env(safe-area-inset-left));box-shadow:2px 0 10px rgba(0,0,0,.15);z-index:30}
  .brand{justify-content:center}
  .brand>div{display:none}
  .brand svg{width:26px;height:26px}
  .nav{flex-direction:column;gap:2px;flex:1;justify-content:space-evenly}
  .nav button{display:flex;flex-direction:column;align-items:center;padding:3px 0;border-radius:10px;font-size:9.5px;line-height:1.1;position:relative}
  .nav .ni{display:block;font-size:18px;line-height:1.1}
  .nav .nl-x{display:none}
  .navbadge{position:absolute;top:0;right:2px;margin:0;font-size:9px;padding:0 4px}
  .topbar .spacer{display:none}
  .sync-pill{padding:6px 0;justify-content:center;border-radius:10px}

/* schede */
.cards.exg{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.exc{position:relative;border-top:4px solid var(--c)}
.exc .thumb{position:relative;overflow:hidden}
.exc .card-body{gap:6px;flex:1}
.exc h3{font-size:15.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.exmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-2);font-weight:600;align-items:center}
.exmeta span{display:inline-flex;align-items:center;gap:4px}
.exmeta svg{width:15px;height:15px;color:var(--muted)}
.int{display:inline-flex;gap:3px}
.int i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:inline-block}
.int.i1 i:nth-child(-n+1),.int.i2 i:nth-child(-n+2),.int.i3 i:nth-child(-n+3){background:var(--c,var(--accent))}
.exc .clamp{-webkit-line-clamp:2;font-size:13px;color:var(--muted);margin:0}
.favb{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#9aa1b0;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2}
.favb svg{width:19px;height:19px}
.favb.on{color:#f0a500}
.usedb{position:absolute;left:6px;bottom:6px;background:rgba(31,42,68,.78);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;z-index:2}
.usedb svg{width:12px;height:12px}
.usedb.never{background:rgba(224,123,34,.9)}
/* miniature ritagliate */
.thumb img.fig{object-fit:cover;object-view-box:inset(1% 8% 23% 8%)}
.thumb img.crt{object-fit:cover;object-view-box:inset(5% 9% 5% 9%)}
.detail-schema img.crt{object-view-box:inset(4% 8% 4% 8%)}
/* vista compatta: icona del fondamentale */
.ex-row .th.ic{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);padding:9px;width:44px;height:44px;border-radius:12px}
.ex-row{grid-template-columns:44px minmax(0,1fr) auto auto}
.ex-row .fv{color:#f0a500;width:18px;height:18px}
@media (max-width:760px){
  .ex-sticky{top:52px}
  .cards.exg{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .exc h3{font-size:14px}
  .exmeta{font-size:11.5px;gap:3px 9px}
  .exmeta svg{width:13px;height:13px}
  .ftiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ftile{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}
  .ftile .exi{width:44px;height:44px;padding:9px}
  .ftile b{font-size:15px}
  .favb{width:30px;height:30px}
  .ex-row{grid-template-columns:40px minmax(0,1fr) auto}
  .ex-row .th.ic{width:40px;height:40px;padding:8px}
  .ex-row .tags{grid-column:2/-1}
}
@media (orientation: landscape) and (max-height:520px){ .ex-sticky{top:0} }
/* dettaglio */
.exd-head{display:flex;align-items:flex-start;gap:10px}
.exd-kick{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.exd-kick .exi{width:18px;height:18px}
.exd-nav{display:flex;gap:4px}
.exd-nav .iconbtn svg{width:18px;height:18px}
.exd-info{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.exd-info span{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600}
.exd-info svg{width:16px;height:16px;color:var(--muted)}
.exd-sec{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.exd-sec .ei{font-size:18px;line-height:1.3;text-align:center}
.exd-sec h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--c,var(--accent));font-weight:800}
.exd-sec p{margin:2px 0 0;grid-column:2}
.exd-used{font-size:13px;color:var(--muted);margin:-6px 0 12px;display:flex;align-items:center;gap:6px}
.exd-used svg{width:14px;height:14px}
.exd-foot .sp{flex:1}
@media (max-width:760px){ .exd-foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} .exd-foot .addto{grid-column:1/-1} .exd-foot .sp{display:none} .exd-foot>.btn{justify-content:center;padding:8px 4px;font-size:13.5px} }
.exd-swipe{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
@media screen{
:root[data-theme=dark] .thumb{background:#2a2f38}
:root[data-theme=dark] .thumb img,:root[data-theme=dark] .detail-schema img,:root[data-theme=dark] .thumb svg{filter:brightness(.9)}
:root[data-theme=dark] .favb{background:rgba(30,33,40,.85)}
:root[data-theme=dark] .fpills button i{background:rgba(255,255,255,.15)}
:root[data-theme=dark] .fpanel .opts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
}


/* ---------- PRESENZE: vista per allenamento ---------- */
.pday-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pday-head .iconbtn{width:40px;height:40px;font-size:22px;flex:none}
.pd-date{flex:1;text-align:center;min-width:0}
.pd-date b{display:block;font-size:18px;text-transform:capitalize}
.pd-date span{font-size:13px;color:var(--muted)}
.pd-count{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.pd-count span{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.pd-count .cP{background:#dff3e6;color:#1d6b3c}.pd-count .cA{background:#fde4e7;color:#b3263a}.pd-count .cG{background:#fff1d6;color:#8a5a00}.pd-count .c0{background:var(--surface-2);color:var(--muted)}
.pd-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.pd-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pd-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.pd-row:first-child{border-top:0}
.pd-row .av{margin:0}
.pd-row .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-row .nm small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-seg{display:flex;gap:6px}
.pd-seg button{width:46px;height:42px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font-size:19px;font-weight:800;color:#b9bec9;cursor:pointer;touch-action:manipulation}
.pd-seg .sP.on{background:#22a05a;border-color:#22a05a;color:#fff}
.pd-seg .sA.on{background:#d64a5a;border-color:#d64a5a;color:#fff}
.pd-seg .sG.on{background:#e0a020;border-color:#e0a020;color:#fff}
.pd-row.s0 .nm b::after{content:' ·';color:var(--muted)}
@media (max-width:760px){
  .reg .sticky{max-width:118px;overflow:hidden;text-overflow:ellipsis}
  .reg .sticky .av{display:none}
  .pd-seg button{width:44px;height:44px}
}
/* ---------- PARTITA a schede ---------- */
.mtabs{display:none}
@media (max-width:1100px){
  .mtabs{display:flex;gap:4px;position:sticky;top:56px;z-index:12;background:var(--bg);padding:6px 0 8px;margin:-6px 0 8px}
  .mtabs button{flex:1 1 auto;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 6px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:0}
  .mtabs button.on{background:var(--bar);border-color:var(--bar);color:#fff}
  .mtabs .b{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:10.5px;padding:0 5px;min-width:16px;line-height:16px}
  .mtabs .b[hidden]{display:none}
  .mtabbed .sess-layout{grid-template-columns:1fr!important}
  .mtabbed [data-mt]{display:none!important}
  .mtabbed.mt-dati [data-mt=dati],.mtabbed.mt-conv [data-mt=conv],.mtabbed.mt-form [data-mt=form]{display:block!important}
  .mtabbed.mt-invia [data-mt=invia]{display:flex!important;position:static;max-height:none}
  .mtabbed.mt-dati .msum[data-mt=dati]{display:grid!important}
  .mtabbed [data-mt].hidden{display:none!important}
}
@media (min-width:761px) and (max-width:1100px){ .mtabs{top:64px} }
@media (orientation: landscape) and (max-height:520px){ .mtabs{top:0} }
.msum{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px}
.msum .it{display:flex;flex-direction:column;gap:1px;min-width:0}
.msum .it span{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.msum .it b{font-size:15px;overflow-wrap:anywhere}
.msum .full{grid-column:1/-1}
.msum .ed{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){ .msum{grid-template-columns:1fr 1fr;gap:8px 12px} .msum .it b{font-size:14px} .pd-seg{gap:4px} .pd-seg button{width:40px;height:42px} }
/* ---------- PROFILO ATLETA ---------- */
.atp-head{display:flex;align-items:center;gap:14px;min-width:0}
.atp-head .avw{margin:0}
.atp-head h2{font-size:21px}
.atp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.atp-tags span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.atp-tags .off{color:#b3263a}
.atp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.atp-t{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.atp-t .k{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.atp-t b{display:block;font-size:19px;margin-top:2px}
.atp-t small{display:block;font-size:12.5px;color:var(--ink-2)}
.atp-t.ok{border-color:#7cc99a}.atp-t.ok b{color:#1d6b3c}
.atp-t.warn{border-color:#f0c56b}.atp-t.warn b{color:#8a5a00}
.atp-t.bad{border-color:#e9a0aa}.atp-t.bad b{color:#b3263a}
.atp-t.go{cursor:pointer}
.atp-contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.atp-contact .btn{text-decoration:none}
.atp-note{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.atf{margin-bottom:14px}
.atf h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 8px;font-weight:800}
.atf-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.atf-g .w2{grid-column:span 2}.atf-g .w3{grid-column:1/-1}
@media (max-width:760px){
  .atf-g{grid-template-columns:1fr 1fr;gap:8px 10px}
  .atf-g .w2,.atf-g .w3{grid-column:1/-1}
  .avpick{gap:10px;margin-bottom:12px;padding-bottom:12px}
  .avpick #at-av .av{width:56px!important;height:56px!important}
  .avpick .muted{display:none}
  .avpick .actions{gap:6px}
  .avpick .btn{padding:5px 9px;font-size:12.5px}
  .atp-grid{grid-template-columns:1fr 1fr}
  .atp-t b{font-size:17px}
}
/* ---------- SESSIONE ---------- */
.ssum{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.ssum .it{display:flex;flex-direction:column;min-width:0}
.ssum .it span{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ssum .it b{font-size:15px}
.ssum .ob{flex-basis:100%;font-size:14px;color:var(--ink-2)}
.pk-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pk-head h2{flex:1;margin:0}
.pk-close{display:none}
.picker > .chips{display:none}
.pk-idx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pk-idx .ftile{padding:10px;gap:10px;border-radius:12px}
.pk-idx .ftile .exi{width:38px;height:38px;padding:8px;border-radius:11px}
.pk-idx .ftile b{font-size:14px}
.pk-idx .ftile small{font-size:12px}
.pk-back{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-weight:800;color:var(--c)}
.pk-back .exi{width:28px;height:28px;padding:5px;border-radius:8px;background:color-mix(in srgb,var(--c) 15%,transparent)}
.pitem:has(.mini.ic){grid-template-columns:40px minmax(0,1fr) auto}
.pitem .mini.ic{aspect-ratio:1;width:40px;border:0;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);padding:9px;border-radius:10px}
.pitem .mini.ic svg{width:100%;height:100%}
@media (max-width:760px){
  .picker{display:none!important}
  .picker.open{display:flex!important;position:fixed;inset:0;z-index:70;background:var(--bg);margin:0;border-radius:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));max-height:none}
  .picker.open .plist{flex:1;max-height:none}
  .pk-close{display:inline-grid}
  body:has(.picker.open) .fab{display:none}
}
/* ---------- ATLETI ---------- */
.role-legend button{border:1px solid transparent;background:none;border-radius:999px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.role-legend button.on{border-color:var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.role-legend button i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* ---------- ARCHIVIO a sezioni ---------- */
.acc > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.acc > summary::-webkit-details-marker{display:none}
details.panel.acc > summary::before{display:none}
.acc > summary h2{margin:0;flex:1}
.acc > summary::after{content:'▾';font-size:18px;color:var(--muted);transition:transform .15s}
.acc[open] > summary{margin-bottom:12px}
.acc[open] > summary::after{transform:rotate(180deg)}
@media screen{
:root[data-theme=dark] .pd-count .cP{background:rgba(34,160,90,.2);color:#97e4b8}
:root[data-theme=dark] .pd-count .cA{background:rgba(214,74,90,.2);color:#f4a0ab}
:root[data-theme=dark] .pd-count .cG{background:rgba(240,180,60,.18);color:#f3ca72}
:root[data-theme=dark] .mtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-theme=dark] .atp-t.ok b{color:#97e4b8}:root[data-theme=dark] .atp-t.warn b{color:#f3ca72}:root[data-theme=dark] .atp-t.bad b{color:#f4a0ab}
}


.exp-list{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.exp-pre .btn{white-space:normal;text-align:left}
.exp-it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.exp-it:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.exp-it input{width:20px;height:20px;accent-color:var(--accent)}
.exp-it b{font-size:15px}
.exp-it small{grid-column:2/-1;color:var(--muted);font-size:12.5px}
.exp-it .n{font-size:13px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.exp-it .priv{color:#b3263a;font-weight:700}
.exp-sub{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.exp-sub label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;cursor:pointer}
.exp-sub input{width:15px;height:15px}
.exp-pre{display:flex;flex-wrap:wrap;gap:8px}


/* ---------- ALLENAMENTO IN CORSO ---------- */
body.train-mode .topbar,body.train-mode .fab{display:none!important}
body.train-mode{padding:0!important}
body.train-mode main{padding:0!important;max-width:none}
.trm{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.trm-top{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bar);color:#fff}
.trm-top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.trm-top .tt{flex:1;min-width:0}
.trm-top .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.trm-top .tt span{font-size:12.5px;opacity:.85}
.trm-prog{height:6px;background:rgba(0,0,0,.08);display:flex}
.trm-prog i{display:block;height:100%}
.trm-body{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:14px 16px;min-height:0}
.trm-fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;place-items:center;min-height:0}
.trm-fig img,.trm-fig svg{width:100%;height:100%;object-fit:contain;display:block;max-height:62vh}
.trm-fig .noschema{padding:40px;color:var(--muted)}
.trm-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.trm-kick{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.trm-kick .exi{width:18px;height:18px}
.trm-info h2{font-size:24px;line-height:1.2}
.trm-clock{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trm-clock .t{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.trm-clock .t.over{color:#d64a5a;animation:pulse 1s infinite}
.trm-clock .btns{display:flex;gap:6px}
.trm-clock .btn{font-size:16px;padding:10px 14px}
.trm-chips{display:flex;flex-wrap:wrap;gap:6px}
.trm-chips span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.trm-key{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;font-size:15px}
.trm-txt{font-size:14.5px;color:var(--ink-2);overflow:auto}
.trm-txt b{color:var(--ink)}
.trm-foot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.trm-foot .btn{font-size:16px;padding:12px 16px}
.trm-foot .nx{min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trm-foot .nx b{color:var(--ink)}
.trm-done{text-align:center;padding:60px 20px}
@media (max-width:760px){
  .trm-body{grid-template-columns:1fr;padding:10px 12px;gap:10px}
  .trm-fig img,.trm-fig svg{max-height:30vh}
  .trm-info h2{font-size:20px}
  .trm-clock .t{font-size:46px}
}
@media (orientation: landscape) and (max-height:520px){
  .trm-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:8px 12px}
  .trm-fig img,.trm-fig svg{max-height:56vh}
  .trm-clock .t{font-size:40px}
  .trm-info h2{font-size:18px}
  .trm-foot{padding:6px 12px}
}
/* barra in alto sul PC con la voce Note */
@media (min-width:1181px){ .topbar{gap:16px} .nav button{padding:8px 11px} .sync-pill{max-width:210px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0} }
@media (min-width:1181px) and (max-width:1380px){ .sync-pill span{display:none} .sync-pill{padding:8px 10px} }
@media (max-width:760px){ .tiles .tile:last-child:nth-child(odd){grid-column:1/-1} }
/* ---------- GENERATORE ---------- */
.gen-g{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.gen-blocks{display:flex;flex-wrap:wrap;gap:8px}
.gen-blocks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.gen-prev{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gen-prev div{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:7px 10px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.gen-prev div:first-child{border-top:0}
.gen-prev i{font-style:normal;font-size:12px;font-weight:800;color:#fff;border-radius:6px;padding:2px 6px;text-align:center}
@media (max-width:760px){ .gen-g{grid-template-columns:1fr} }
/* ---------- DISPONIBILITÀ ---------- */
.disp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.disp-row .av{margin:0}
.disp-row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp-seg{display:flex;gap:5px}
.disp-seg button{border:1.5px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--muted)}
.disp-seg .si.on{background:#22a05a;border-color:#22a05a;color:#fff}
.disp-seg .no.on{background:#d64a5a;border-color:#d64a5a;color:#fff}
.disp-tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;background:#22a05a;color:#fff;border-radius:999px;padding:1px 7px;vertical-align:2px}
/* ---------- ANDAMENTO ---------- */
.trend{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;background:var(--surface-2)}
.trend h3{font-size:14px;margin:0 0 6px}
.trend svg{width:100%;height:auto;display:block}
.trend .lg{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.trend .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* ---------- NOTE ---------- */
.notes{columns:3 260px;column-gap:14px}
.note{break-inside:avoid;margin:0 0 14px;border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.06);background:var(--nc,var(--surface));color:#1f2a44;position:relative}
.note h3{font-size:16px;margin:0 0 6px;padding-right:22px}
.note p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden}
.note .meta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:11.5px;color:#5b6475}
.note .meta .lb{background:rgba(0,0,0,.07);border-radius:999px;padding:1px 8px;font-weight:700}
.note .pin{position:absolute;top:10px;right:12px;font-size:15px}
.note-chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.nsw{display:flex;gap:8px;flex-wrap:wrap}
.nsw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);cursor:pointer}
.nsw button.on{box-shadow:0 0 0 2.5px var(--ink)}
#note-text{width:100%;min-height:240px;font-size:15px;line-height:1.5}
@media (max-width:760px){ .notes{columns:2 150px;column-gap:10px} .note{margin-bottom:10px;padding:12px} .note p{-webkit-line-clamp:8;font-size:13.5px} #note-text{min-height:46vh} .nav button[data-nav=note]{display:none} }
@media screen{
:root[data-theme=dark] .note{filter:brightness(.88)}
:root[data-theme=dark] .disp-seg .si.on{color:#fff}
}

.rdy{display:flex;flex-direction:column;gap:10px}
.rdy .it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rdy .it .ic{font-size:20px;text-align:center}
.rdy .it b{display:block}
.rdy .it small{color:var(--muted);font-size:12.5px}

.rf-wrap{max-width:760px;margin:0 auto}
.rf-sets{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.rf-sets button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer}
.rf-sets button.on{background:var(--bar);border-color:var(--bar);color:#fff}
.rf-sets button small{font-weight:600;opacity:.75;margin-left:4px}
.rf-score{background:var(--bar);color:#fff;border-radius:16px;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;box-shadow:var(--shadow)}
.rf-score .t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.rf-score .n{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

.rf-court{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0;max-width:420px}
.rf-court div{border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12.5px;font-weight:700;text-align:center;background:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-court div small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
.rf-court div.sv{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.rf-info{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13.5px}
.rf-info .rot{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:2px 9px;font-weight:800}
.rf-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.rf-big button{border:0;border-radius:16px;padding:22px 10px;font-size:24px;font-weight:800;color:#fff;cursor:pointer;box-shadow:var(--shadow);touch-action:manipulation}
.rf-big .n{background:#22a05a}.rf-big .l{background:#d64a5a}
.rf-big button:active{transform:scale(.97)}
.rf-big button:disabled{opacity:.35}
.rf-small{display:flex;gap:6px;flex-wrap:wrap}
.rf-small .btn{flex:1 1 auto;justify-content:center}
.rf-over{border:2px solid var(--accent);border-radius:14px;padding:12px 14px;margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

.rf-tl{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.rf-tl i{font-style:normal;min-width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;padding:0 3px}
.rf-tl i.N{background:#22a05a}.rf-tl i.L{background:#d64a5a}.rf-tl i.T{background:#8a94a6}.rf-tl i.S{background:#2f6fb8}.rf-tl i.X{background:#333}
.rf-lineup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rf-lineup label{font-size:12.5px;font-weight:700;color:var(--muted)}
.rf-lineup select,.rf-lineup input{margin-top:3px}
.rf-fs{display:flex;gap:6px}
.rf-fs button{flex:1;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.rf-fs button.on{background:var(--bar);border-color:var(--bar);color:#fff}
.rf-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0 12px}
.rf-kpi div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.rf-kpi span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rf-kpi b{font-size:21px}
.rf-kpi small{color:var(--muted);font-size:12px;margin-left:4px}
.rf-ins{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}

.rf-bar{display:flex;align-items:center;gap:6px;min-width:110px}

.rf-worm{margin:4px 0 10px}

.rf-note{font-size:12px;color:var(--muted);margin:8px 0 0}

.guide{max-width:820px;margin:0 auto}

<script>
"use strict";

/* ============================================================

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g,'<br>');

const clone = o => JSON.parse(JSON.stringify(o));
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function toMin(hhmm){ const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||''); return m ? (+m[1])*60 + (+m[2]) : null; }
function fmtClock(t){ t=((t%1440)+1440)%1440; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function fmtDur(m){ m=+m||0; if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return h+' h'+(r?' '+r+' min':''); }
function fmtDate(d, opts){ if(!d) return ''; const dt=new Date(d+'T12:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('it-IT', opts||{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function fondColor(f){
  if(!f) return '#9aa1b0';
  if(FOND_COLORS[f]) return FOND_COLORS[f];
  let h=0; for(const c of f) h=(h*31+c.charCodeAt(0))>>>0; return EXTRA_COLORS[h%EXTRA_COLORS.length];
}
function tag(f){ return f ? `<span class="tag" style="--c:${fondColor(f)}">${esc(f)}</span>` : ''; }
function ptag(t){ return t ? `<span class="tag plain">${esc(t)}</span>` : ''; }

}

/* ============================================================
   Schema del campo (SVG)
   ============================================================ */
const SW=960, SH=521;
const ZONES=[[418,136,4],[418,260,3],[418,384,2],[232,136,5],[232,260,6],[232,384,1],[542,136,2],[542,260,3],[542,384,4],[728,136,1],[728,260,6],[728,384,5]];
const LAYER={zone:0,bench:1,ballpath:2,move:2,cone:3,coach:4,p1:5,p2:5,ball:6,text:7};
const TYPE_NAME={p1:'Giocatore squadra 1',p2:'Giocatore squadra 2',coach:'Allenatore',cone:'Cinesino',ball:'Pallone',zone:'Bersaglio / zona',bench:'Panca',text:'Testo',ballpath:'Traiettoria della palla',move:'Spostamento'};

function courtMarkup(showZones){
  let s = `<rect width="${SW}" height="${SH}" fill="#e8ecf0"/>
<rect x="108" y="74" width="744" height="372" fill="#f4d3a1"/>
<rect x="356" y="74" width="248" height="372" fill="#eec389"/>
<rect x="108" y="74" width="744" height="372" fill="none" stroke="#fff" stroke-width="3"/>
<line x1="356" y1="74" x2="356" y2="446" stroke="#fff" stroke-width="3"/>
<line x1="604" y1="74" x2="604" y2="446" stroke="#fff" stroke-width="3"/>`;
  if(showZones) for(const [x,y,n] of ZONES) s += `<text x="${x}" y="${y+22}" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#1f2a44" fill-opacity=".12">${n}</text>`;
  s += `<line x1="480" y1="45" x2="480" y2="475" stroke="#262626" stroke-width="6"/>
<circle cx="480" cy="45" r="7" fill="#262626"/><circle cx="480" cy="475" r="7" fill="#262626"/>`;
  return s;
}
function lineGeom(el){
  const mx=(el.x1+el.x2)/2, my=(el.y1+el.y2)/2, dx=el.x2-el.x1, dy=el.y2-el.y1, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L, b=el.b||0, hx=mx+nx*b, hy=my+ny*b;
  return {mx,my,nx,ny,hx,hy,cx:2*hx-mx,cy:2*hy-my,L};
}
function f1(n){ return Math.round(n*10)/10; }
function lineMarkup(el){
  const g=lineGeom(el), ball=el.t==='ballpath';
  const col = ball ? '#1f2a44' : '#22a05a', sw = ball ? 2.6 : 3.6, hl = ball ? 15 : 17, hw = ball ? 6.5 : 8;
  let ux=el.x2-g.cx, uy=el.y2-g.cy, ul=Math.hypot(ux,uy);
  if(ul<1){ ux=el.x2-el.x1; uy=el.y2-el.y1; ul=Math.hypot(ux,uy)||1; }
  ux/=ul; uy/=ul;
  const ex=el.x2-ux*hl*0.7, ey=el.y2-uy*hl*0.7, bx=el.x2-ux*hl, by=el.y2-uy*hl;
  const d=`M${f1(el.x1)} ${f1(el.y1)} Q${f1(g.cx)} ${f1(g.cy)} ${f1(ex)} ${f1(ey)}`;
  let s=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" ${ball?'stroke-dasharray="9 7"':''} stroke-linecap="round"/>`;
  s+=`<polygon points="${f1(el.x2)},${f1(el.y2)} ${f1(bx-uy*hw)},${f1(by+ux*hw)} ${f1(bx+uy*hw)},${f1(by-ux*hw)}" fill="${col}"/>`;
  if(ball && el.num!=null && String(el.num).trim()!==''){
    const n=String(el.num), w=Math.max(20, n.length*9+10);
    s+=`<rect x="${f1(g.hx-w/2)}" y="${f1(g.hy-11)}" width="${w}" height="22" rx="4" fill="#fff" stroke="#1f2a44" stroke-width="1.5"/>
<text x="${f1(g.hx)}" y="${f1(g.hy+5)}" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2a44">${esc(n)}</text>`;
  }
  return {s,d};
}
function elMarkup(el, interactive){
  const id = interactive ? ` data-id="${el.id}" class="el"` : '';
  if(typeof FIGM!=='undefined' && FIGM[el.t]) return FIGM[el.t](el, id, interactive);
  const {x,y} = el;
  switch(el.t){
    case 'p1': case 'p2': {
      const lab=String(el.label??''), fs = lab.length>2 ? 12 : lab.length>1 ? 14.5 : 17;
      return `<g${id}><circle cx="${x}" cy="${y}" r="19" fill="${el.t==='p1'?'#2f6fb8':'#d64a5a'}" stroke="#fff" stroke-width="2.5"/>
<text x="${x}" y="${y+fs*0.36}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${fs}" font-weight="700" fill="#fff">${esc(lab)}</text></g>`;
    }
    case 'coach': {
      const lab=String(el.label??'All.');
      return `<g${id}><rect x="${x-24}" y="${y-16}" width="48" height="32" rx="4" fill="#333" stroke="#fff" stroke-width="1.5"/>
<text x="${x}" y="${y+5}" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.5" font-weight="700" fill="#fff">${esc(lab)}</text></g>`;
    }
    case 'cone': return `<g${id}><polygon points="${x},${y-13} ${x+12},${y+10} ${x-12},${y+10}" fill="#f28c28" stroke="#fff" stroke-width="1"/></g>`;
    case 'ball': return `<g${id}><circle cx="${x}" cy="${y}" r="11" fill="#ffd23f" stroke="#1f2a44" stroke-width="1.6"/>
<path d="M${x-10} ${y-3} Q${x} ${y+3} ${x+10} ${y-4} M${x-2} ${y-11} Q${x+5} ${y} ${x-1} ${y+11}" fill="none" stroke="#1f2a44" stroke-width="1.3"/></g>`;
    case 'zone': return `<g${id}><rect x="${x}" y="${y}" width="${el.w}" height="${el.h}" rx="3" fill="#f7e6a4" fill-opacity=".85" stroke="#d9b63a" stroke-width="2" stroke-dasharray="7 5"/></g>`;
    case 'bench': { const v=el.rot===90, w=v?24:90, h=v?90:24;
      return `<g${id}><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="2" fill="#8a5a35" stroke="#5b3a20" stroke-width="2"/></g>`; }
    case 'text': return `<g${id}><text x="${x}" y="${y+7}" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2a44" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">${esc(el.label||'')}</text></g>`;
    case 'ballpath': case 'move': {
      const {s,d}=lineMarkup(el);
      return interactive ? `<g${id}><path d="${d}" fill="none" stroke="transparent" stroke-width="18" pointer-events="stroke"/>${s}</g>` : s;
    }
  }
  return '';
}
function selMarkup(el){
  if(FIGS[el.t]) return FIGS[el.t](el);
  const ring='fill="none" stroke="#e07b22" stroke-width="2" stroke-dasharray="5 4" pointer-events="none"';
  const hnd=(x,y,h,fill)=>`<circle data-h="${h}" cx="${f1(x)}" cy="${f1(y)}" r="9" fill="${fill||'#fff'}" stroke="#e07b22" stroke-width="2.5"/>`;
  switch(el.t){
    case 'p1': case 'p2': case 'ball': case 'cone': return `<circle cx="${el.x}" cy="${el.y}" r="27" ${ring}/>`;
    case 'coach': return `<rect x="${el.x-31}" y="${el.y-23}" width="62" height="46" rx="6" ${ring}/>`;
    case 'bench': { const v=el.rot===90, w=v?24:90, h=v?90:24; return `<rect x="${el.x-w/2-7}" y="${el.y-h/2-7}" width="${w+14}" height="${h+14}" rx="5" ${ring}/>`; }
    case 'text': { const w=Math.max(30,String(el.label||'').length*12)+16; return `<rect x="${el.x-w/2}" y="${el.y-17}" width="${w}" height="34" rx="5" ${ring}/>`; }
    case 'zone': return `<rect x="${el.x-5}" y="${el.y-5}" width="${el.w+10}" height="${el.h+10}" rx="5" ${ring}/>`+hnd(el.x+el.w,el.y+el.h,'resize');
    case 'ballpath': case 'move': case 'farrow': case 'band': { const g=lineGeom(el); return hnd(el.x1,el.y1,'p1')+hnd(el.x2,el.y2,'p2')+hnd(g.hx,g.hy,'mid','#e07b22'); }
  }
  return '';
}
function sortedEls(els){ return els.map((e,i)=>[e,i]).sort((a,b)=>(LAYER[a[0].t]-LAYER[b[0].t])||(a[1]-b[1])).map(p=>p[0]); }
function schemaSVG(schema, cls){
  const els = sortedEls(schema?.els||[]).map(e=>elMarkup(e,false)).join('');
  return `<svg viewBox="0 0 ${SW} ${SH}" xmlns="http://www.w3.org/2000/svg" class="${cls||''}" preserveAspectRatio="xMidYMid meet">${schemaBg(schema)}${els}${figCap(schema)}</svg>`;
}
function hasSchema(ex){ return !!(ex && ((ex.schema && ex.schema.els) || ex.image)); }
function exVisual(ex){
  if(ex?.schema && ex.schema.els) return schemaSVG(ex.schema);
  if(ex?.image) return `<img src="${ex.image}" alt="Schema: ${esc(ex.titolo)}">`;
  return `<span class="noschema">Nessuno schema</span>`;
}
function legendSVG(){
  const items=[
    [{t:'p1',x:30,y:34,label:'A'},'giocatore / squadra 1'],[{t:'p2',x:280,y:34,label:'A'},'squadra 2'],
    [{t:'coach',x:440,y:34,label:'All.'},'allenatore'],[{t:'cone',x:640,y:36},'cinesino'],[{t:'ball',x:810,y:34},'pallone'],
    [{t:'ballpath',x1:12,y1:96,x2:96,y2:96,b:0},'traiettoria della palla'],[{t:'move',x1:330,y1:96,x2:414,y2:96,b:0},'spostamento'],
    [{t:'zone',x:570,y:82,w:48,h:28},'bersaglio / zona'],[{t:'bench',x:648,y:96,rot:0,w:0},'panca']
  ];
  let s='';
  for(const [el,lab] of items){
    const e={...el}; if(e.t==='bench'){ /* panca più corta in legenda */ s+=`<rect x="790" y="86" width="60" height="20" rx="2" fill="#8a5a35" stroke="#5b3a20" stroke-width="2"/>`; }
    else s+=elMarkup(e,false);
    const lx = el.t==='ballpath'||el.t==='move' ? el.x2+14 : el.t==='zone' ? el.x+el.w+12 : el.t==='bench' ? 862 : el.x+30;
    s+=`<text x="${lx}" y="${(el.y??el.y1??96)+(el.t==='zone'?19:5)}" font-family="Arial,sans-serif" font-size="17" fill="#222">${esc(lab)}</text>`;
  }
  return `<svg viewBox="0 0 960 130" xmlns="http://www.w3.org/2000/svg"><rect width="960" height="130" fill="#f3f4f6" rx="8"/>${s}</svg>`;
}

/* converte un file immagine in data URL ridimensionato */
function imageToDataURL(file, max, cb, square){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image();
    img.onload=()=>{ const c=document.createElement('canvas'), x=c.getContext('2d');
      if(square){ const S=max, side=Math.min(img.width,img.height); c.width=c.height=S; x.fillStyle='#fff'; x.fillRect(0,0,S,S);
        x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S); }
      else { const sc=Math.min(1, max/img.width); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); }
      cb(c.toDataURL('image/jpeg',0.85)); };
    img.onerror=()=>alert('Immagine non leggibile.'); img.src=r.result; };
  r.readAsDataURL(file);
}
/* finestra per adattare un'immagine al riquadro degli schemi (960×521) */
function openFitDialog(srcURL, onDone){
  const img=new Image();
  img.onload=()=>{
    const W=SW, H=SH, fit=Math.min(W/img.width, H/img.height);
    const st={scale:100, dx:0, dy:0};
    openModal(`<div class="modal-box" style="max-width:860px">
      <div class="modal-head"><div style="flex:1"><h2>Adatta l'immagine allo schema</h2>
        <div class="muted" style="font-size:13.5px;margin-top:4px">Il riquadro ha le stesse proporzioni degli schemi del campo. Usa il cursore per la dimensione e trascina l'immagine per spostarla.</div></div>
        <button type="button" class="iconbtn" data-action="close-modal">✕</button></div>
      <div class="modal-body"><canvas id="fit-cv" class="fit-cv" width="${W}" height="${H}"></canvas>
        <div class="fit-row"><label>Dimensione <input type="range" id="fit-scale" min="10" max="300" step="1" value="100"> <span id="fit-pct">100%</span></label>
          <button type="button" class="btn sm" id="fit-reset">Adatta al riquadro</button>
          <button type="button" class="btn sm" id="fit-half">Metà</button></div></div>
      <div class="modal-foot"><span style="flex:1"></span><button type="button" class="btn" data-action="close-modal">Annulla</button><button type="button" class="btn primary" id="fit-ok">Usa questa immagine</button></div></div>`);
    const cv=$('#fit-cv'), x=cv.getContext('2d'), sl=$('#fit-scale');
    const draw=()=>{ const w=img.width*fit*st.scale/100, h=img.height*fit*st.scale/100;
      x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.drawImage(img,(W-w)/2+st.dx,(H-h)/2+st.dy,w,h);
      $('#fit-pct').textContent=st.scale+'%'; sl.value=st.scale; };
    sl.oninput=()=>{ st.scale=+sl.value; draw(); };
    $('#fit-reset').onclick=()=>{ st.scale=100; st.dx=st.dy=0; draw(); };
    $('#fit-half').onclick=()=>{ st.scale=50; st.dx=st.dy=0; draw(); };
    let drag=null;
    cv.onpointerdown=e=>{ drag={x:e.clientX,y:e.clientY,dx:st.dx,dy:st.dy}; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); };
    cv.onpointermove=e=>{ if(!drag) return; const k=W/cv.getBoundingClientRect().width; st.dx=drag.dx+(e.clientX-drag.x)*k; st.dy=drag.dy+(e.clientY-drag.y)*k; draw(); };
    cv.onpointerup=cv.onpointercancel=()=>{ drag=null; cv.classList.remove('drag'); };
    cv.onwheel=e=>{ e.preventDefault(); st.scale=Math.max(10,Math.min(300,st.scale+(e.deltaY<0?5:-5))); draw(); };
    $('#fit-ok').onclick=()=>{ const url=cv.toDataURL('image/jpeg',0.88); closeModal(); onDone(url); };
    draw();
  };
  img.onerror=()=>alert('Immagine non leggibile.');
  img.src=srcURL;
}
