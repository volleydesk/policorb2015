function hexRGB(h){ h=String(h||'').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); if(!/^[0-9a-f]{6}$/i.test(h)) return null; return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); }
function lumRGB(c){ const v=c.map(x=>x/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)); return .2126*v[0]+.7152*v[1]+.0722*v[2]; }
const toHex=c=>'#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function darkenTo(h,max){ let c=hexRGB(h); if(!c) return null; let k=0; while(lumRGB(c)>max && k<60){ c=c.map(v=>v*.92); k++; } return toHex(c); }
function applyBrand(){
  const st=db.settings||{}, R=document.documentElement.style;
  const bar=(st.colore&&darkenTo(st.colore,.1))||'#1f2a44';
  const accRGB=hexRGB(st.accento), acc=accRGB?toHex(accRGB):'#e07b22';
  R.setProperty('--bar',bar); R.setProperty('--accent',acc); R.setProperty('--accent-ink', lumRGB(hexRGB(acc))>.42?'#1f2a44':'#ffffff');
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.setAttribute('content',bar);
  const b=document.querySelector('.brand');
  if(b){ let img=b.querySelector('img.logo'); const svg=b.querySelector('svg');
    if(st.logo){ if(!img){ img=document.createElement('img'); img.className='logo'; img.alt=''; b.insertBefore(img,b.firstChild); } if(img.getAttribute('src')!==st.logo) img.src=st.logo; if(svg) svg.style.display='none'; }
    else { if(img) img.remove(); if(svg) svg.style.display=''; } }
  const fav=document.querySelector('link[rel=icon]'); if(fav) fav.href=st.logo||'icons/icon-192.png';
}
function setLogo(url){ const im=new Image(); im.onload=()=>{ const k=Math.min(1,256/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    db.settings.logo=c.toDataURL('image/jpeg',.9); persist.settings().catch(saveFail); applyBrand(); render(); toast('Logo salvato'); };
  im.onerror=()=>alert('Immagine non leggibile.'); im.src=url; }

let saveTimer=null;
const pending=new Map();
function flushPending(keepalive){
  clearTimeout(saveTimer);
  for(const [id,s] of [...pending]){
    pending.delete(id);
    api('PUT','/api/sessioni/'+encodeURIComponent(id), s, {keepalive:!!keepalive}).then(()=>{
      const i=$('#saved-ind'); if(i){ i.textContent='✓ Salvato'; clearTimeout(flushPending._t); flushPending._t=setTimeout(()=>{ if($('#saved-ind')) $('#saved-ind').textContent=''; },1500); }
    }).catch(saveFail);
  }
}

function touchSess(s, rerender){

  if(rerender==='items'){ $('#items').innerHTML=itemsHTML(s); $$('#items textarea').forEach(autoGrow); $('#sess-summary').innerHTML=summaryHTML(s); $('#plist').innerHTML=pickListHTML(s); }

async function syncConnect(tokenOnly){
  const f=$('#sync-form'), msg=$('#sync-msg');
  const v=n=>(f.querySelector(`[name=${n}]`).value||'').trim();
  const c={owner:v('owner').replace(/^@/,''), repo:v('repo'), token:v('token')};
  if(!c.owner||!c.repo||!c.token){ alert('Compila nome utente, nome dell\'archivio e codice di accesso.'); return; }
  await Store.setMeta('syncLast',{owner:c.owner, repo:c.repo});
  const btn=$('[data-action=sync-connect]'); btn.disabled=true; msg.textContent='Controllo l\'archivio…';
  try{
    const p=await Sync.probe(c);
    if(!p.private && !confirm('Attenzione: l\'archivio «'+c.repo+'» è PUBBLICO, quindi chiunque potrebbe leggere i dati degli atleti. Ti consiglio di renderlo privato su GitHub (Settings → Danger Zone → Change visibility). Vuoi continuare lo stesso?')){ msg.textContent=''; return; }
    let replace=false;
    if(p.ambito && p.ambito.tipo==='squadra'){
      if(!Store.isEmpty() && !confirm(`Questo è l'archivio della squadra «${p.ambito.nome||''}», gestito dalla segreteria.\n\nI dati che ci sono adesso su questo dispositivo verranno sostituiti da quelli della squadra (se ti servono, prima scarica una copia da Archivio). Continuare?`)){ msg.textContent=''; return; }
      replace=true; await Store.setMeta('ambito', p.ambito);
    }
    else if(p.remoteCount>0 && !Store.isEmpty() && !tokenOnly){
      const ch=await choiceModal('Ci sono già dei dati online', `Nell'archivio online ci sono già <b>${p.remoteCount}</b> schede (esercizi, sessioni, atleti…). Anche su questo dispositivo ci sono dei dati. Cosa vuoi fare?`, [
        {ic:'☁️', t:'Usa i dati online (consigliato)', d:'Questo dispositivo prende i dati dall\'archivio online; quelli che ci sono adesso qui vengono sostituiti.'},
        {ic:'🔀', t:'Unisci i dati', d:'Le schede di questo dispositivo vengono aggiunte a quelle online. Attenzione: gli esercizi del catalogo potrebbero risultare doppi.'}]);
      if(ch<0){ msg.textContent=''; return; }
      replace = ch===0;
    } else if(p.remoteCount>0 && Store.isEmpty()) replace=true;
    msg.textContent='Sincronizzo… (la prima volta può volerci qualche minuto)';
    await Sync.connect(p.cfg, replace);
    await Store.setMeta('avviato', true);
    await loadState(); ui.view = ui.view==='benvenuto' ? 'home' : ui.view; render();
    const st=Sync.status();
    toast(st.status==='error' ? 'Collegato, ma la sincronizzazione ha dato un errore' : 'Archivio collegato: dati sincronizzati');
  }catch(e){ console.error(e); msg.textContent=''; alert('Collegamento non riuscito.\n\n'+(e.message||e)); }
  finally{ if(btn.isConnected) btn.disabled=false; }
}

function importBackup(){

      let d; try{ const j=JSON.parse(r.result); d=j.data||j; if(j.demoBase) d=demoShift(d, j.demoBase); if(!Array.isArray(d.exercises)||!Array.isArray(d.sessions)) throw 0; }catch(e){ alert('Il file non è un backup valido dello schedario.'); return; }

        <div class="modal-foot"><button class="btn" data-action="close-modal">Annulla</button><span style="flex:1"></span><button class="btn danger" id="imp-replace">Sostituisci tutto</button><button class="btn primary" id="imp-merge">Unisci</button></div></div>`);
      const run = mode => api('POST','/api/importa',{mode, data:d}).then(async res=>{
        await Store.setMeta('avviato', true); if(ui.view==='benvenuto') ui.view='home';
        await loadState(); closeModal(); render();
        toast(mode==='merge' ? `Importati: ${res.aggiunti} nuovi, ${res.aggiornati} aggiornati` : 'Archivio sostituito');

    };
    r.readAsText(f);
  };
  inp.click();
}

/* riduce il testo finché tutto sta in due facciate A4 */
function fitTwoPages(html){
  const box=document.createElement('div');
  box.style.cssText='position:absolute;left:-10000px;top:0;width:194mm;background:#fff;visibility:hidden';
  box.innerHTML=html; document.body.appendChild(box);
  const pc=box.querySelector('.pc'), mm=96/25.4, pageH=281*mm;
  const pages=()=>{   // simula le interruzioni di pagina: una scheda non si spezza
    let used=pc.querySelector('.pcx-grid')?.offsetTop||0, page=1;
    const cards=[...pc.querySelectorAll('.pcx')], rowsY={};
    cards.forEach(c=>{ rowsY[c.offsetTop]=Math.max(rowsY[c.offsetTop]||0, c.offsetHeight); });
    const tops=Object.keys(rowsY).map(Number).sort((a,b)=>a-b);
    let pos=used;
    for(const t of tops){ const hgt=rowsY[t]+6; if(pos+hgt>page*pageH){ pos=page*pageH; page++; } pos+=hgt; }
    const tail=pc.scrollHeight-((tops.length?tops[tops.length-1]+rowsY[tops[tops.length-1]]:used));
    if(pos+tail>page*pageH) page++;
    return page;
  };
  let z=1;
  for(; z>0.62; z-=0.03){ pc.style.setProperty('--pz', z.toFixed(2)); if(pages()<=2) break; }
  const out=html.replace('<div class="pc">', `<div class="pc" style="--pz:${Math.max(z,0.62).toFixed(2)}">`);
  box.remove();
  return out;
}

function parseISO(d){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(a,b){ return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5); }
function daysTo(iso){ const d=parseISO(iso); return d ? daysBetween(today0(), d) : null; }
function ageOf(a){
  const b=parseISO(a.dataNascita); if(!b) return null; const t=today0();
  let y=t.getFullYear()-b.getFullYear();
  if(t.getMonth()<b.getMonth() || (t.getMonth()===b.getMonth() && t.getDate()<b.getDate())) y--;
  return y>=0 ? y : null;
}
function nextBirthday(a){
  const b=parseISO(a.dataNascita); if(!b) return null; const t=today0();
  const mk=y=>{ const d=new Date(y,b.getMonth(),b.getDate()); return d.getMonth()!==b.getMonth() ? new Date(y,1,28) : d; };  // 29 febbraio -> 28
  let n=mk(t.getFullYear()); if(n<t) n=mk(t.getFullYear()+1);
  return {date:n, days:daysBetween(t,n)};
}
function fullName(a){ return [a.cognome,a.nome].filter(Boolean).join(' ') || 'Senza nome'; }
function shortDate(iso){ return iso ? fmtDate(iso,{day:'2-digit',month:'2-digit',year:'numeric'}) : ''; }

const DEFAULT_CONV_NOTE = "Portare la carta d'identità. Chi non può esserci avvisi il prima possibile.";

const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

function byNumber(a,b){
  const na=parseInt(a.numeroMaglia,10), nb=parseInt(b.numeroMaglia,10);
  if(isNaN(na)!==isNaN(nb)) return isNaN(na)?1:-1;
  if(!isNaN(na) && na!==nb) return na-nb;

function convWarn(a,m,nums){
  const ref=m.data||todayISO(), w=[];
  if(!a.scadenzaVisita) w.push('visita medica mancante');
  else if(a.scadenzaVisita<ref) w.push('visita medica scaduta');
  if(a.scadenzaDocumento && a.scadenzaDocumento<ref) w.push('documento scaduto');
  const st=absStats(a.id, m.data||'9999-12-31'); if(st.n && st.ass>=3) w.push(`assente a ${st.ass} degli ultimi ${st.n} allenamenti`);
  if(!a.numeroMaglia) w.push('manca il numero di maglia');
  else if(nums && nums[a.numeroMaglia]>1) w.push('numero di maglia doppio');

function waText(m){
  const L=[], st=db.settings, c=convocati(m);
  L.push(`🏐 *CONVOCAZIONE*${st.squadra?' – '+st.squadra:''}`);

  L.push(`🆚 ${matchTitle(m)} (${m.inCasa?'in casa':'in trasferta'})`);
  const where=[m.palestra,m.indirizzo].filter(Boolean).join(', ');

/* risultato: set "casa-ospiti"; con le statistiche in partita si usano i set registrati */

function resParse(m){ const r=(m.risultato||'').match(/^\s*(\d)\s*[-–:\/]\s*(\d)(?!\d)/); if(!r) return null; const h=+r[1], a=+r[2]; return m.inCasa?{noi:h, loro:a, src:'ris'}:{noi:a, loro:h, src:'ris'}; }

const ROLE_QUOTA_DEF={'Palleggiatore':2,'Banda':4,'Centrale':4,'Opposto':2,'Libero':0};
const ROLE_LBL_NOTE='';
const isPlayed=m=>!!m.data && (m.data<todayISO() || !!(m.risultato||'').trim() || refMatchOver(m));
function convCount(aid, beforeISO, exceptId){   // partite giocate in cui l'atleta era convocato
  const cm=exceptId&&getMatch(exceptId);
  return db.matches.filter(m=>m.id!==exceptId && isPlayed(m) && (!cm || campOf(m)===campOf(cm)) && (!beforeISO || m.data<beforeISO) && (m.convocati||[]).includes(aid)).length;

function suggestCandidates(m, o){
  const ref=m.data||'9999-12-31', out=[], excl=[];
  for(const a of db.athletes){
    if(!a.iscritto){ excl.push({a, why:'non iscritto'}); continue; }
    if((m.assenti||[]).includes(a.id)){ excl.push({a, why:'assente per impegni personali'}); continue; }
    if(!visitaOk(a,m)){ excl.push({a, why:visitaWhy(a)}); continue; }
    if(wrongSex(a)){ excl.push({a, why:'squadra '+genLabel()}); continue; }
    if(injActive(a, m.data||todayISO()).length){ excl.push({a, why:injWhy(a, m.data||todayISO())}); continue; }
    const st=absStats(a.id, ref), pres=st.n-st.ass;
    out.push({a, st, pres, played:convCount(a.id, m.data, m.id), sp:seasonPct(a.id)??-1});
  }
  const DSP=new Set(m.disponibili||[]);
  out.sort((x,y)=>((DSP.has(y.a.id)?1:0)-(DSP.has(x.a.id)?1:0)) || (y.pres-x.pres) || (x.played-y.played) || (y.sp-x.sp) || fullName(x.a).localeCompare(fullName(y.a),'it'));
  out.forEach((c,i)=>c.rank=i);
  return {cands:out, excl};
}
const isF=a=>/^f/i.test(a.sesso||'');
const isM=a=>/^m/i.test(a.sesso||'');
function sexOf(a){ return isF(a)?'F':isM(a)?'M':''; }
function rolesOf(a){ return [roleKey(a.ruolo), roleKey(a.ruolo2)].filter(Boolean); }
function roleText(a){ return [a.ruolo, a.ruolo2].filter(Boolean).join(' / '); }
function suggestList(m, o){
  const mixed=isMixed(), {cands, excl}=suggestCandidates(m, o), cap={M:Math.max(0,o.men|0), F:Math.max(0,o.women|0)}, N=mixed?cap.M+cap.F:Math.max(0,o.tot|0), pick=[], warn=[];
  const cnt=s=>pick.filter(c=>sexOf(c.a)===s).length;
  const room=c=>{ if(!mixed) return true; const s=sexOf(c.a); return !!s && cnt(s)<cap[s]; };
  const take=(c,why)=>{ c.why=why; pick.push(c); };
  const free=()=>cands.filter(c=>!pick.includes(c));
  cands.forEach(c=>{ c.why=''; });
  if(o.mode==='ruoli'){
    const roles=Object.entries(o.quota).filter(([r,q])=>q>0).map(([r,q])=>[r,q,roleKey(r)]);
    const avail=k=>cands.filter(c=>rolesOf(c.a).includes(k)).length;
    roles.sort((x,y)=>avail(x[2])-avail(y[2]));
    const need={}; roles.forEach(([r,q,k])=>need[k]=(need[k]||0)+q);
    for(const pass of [0,1]){            // 0 = ruolo principale, 1 = secondo ruolo
      for(const [r,q,k] of roles){
        for(const c of free()){
          if(need[k]<=0 || pick.length>=N) break;
          const ok = pass===0 ? roleKey(c.a.ruolo)===k : roleKey(c.a.ruolo2)===k;
          if(ok && room(c)){ take(c, pass?`come ${r} (2° ruolo)`:''); need[k]--; }
        }
      }
    }
    for(const [r,q,k] of roles) if(need[k]>0){ warn.push(`${r}: ${need[k]} mancant${need[k]===1?'e':'i'}`); need[k]=0; }
  }
  for(const c of free()){ if(pick.length>=N) break; if(room(c)) take(c, o.mode==='ruoli'?'completa la lista':''); }
  const sF=mixed?cap.F-cnt('F'):0, sM=mixed?cap.M-cnt('M'):0;
  if(sF>0) warn.push(`solo ${cnt('F')} donne disponibili su ${cap.F}`);
  if(sM>0) warn.push(`solo ${cnt('M')} uomini disponibili su ${cap.M}`);
  for(const c of free()){ if(pick.length>=N) break; take(c, !sexOf(c.a)?'sesso non indicato in anagrafica':(sF>0?'al posto di una donna':'al posto di un uomo')); }
  if(pick.length<N) warn.push(`solo ${pick.length} atleti disponibili su ${N}`);
  pick.sort((x,y)=>x.rank-y.rank);
  return {pick, rest:free(), excl, warn};
}

  };
  draw();
}
/* riepilogo: quante partite ha giocato da convocato ogni atleta */
function convSummary(all){
  const sc=campScope(), played=sc.filter(isPlayed), future=sc.filter(m=>!isPlayed(m));
  const L=db.athletes.filter(a=>all || a.iscritto).map(a=>{
    const mine=played.filter(m=>(m.convocati||[]).includes(a.id)).sort((x,y)=>x.data.localeCompare(y.data));
    return {a, n:mine.length, next:future.filter(m=>(m.convocati||[]).includes(a.id)).length, last:mine.length?mine[mine.length-1].data:'', sp:seasonPct(a.id)};
  }).sort((x,y)=>(x.n-y.n) || fullName(x.a).localeCompare(fullName(y.a),'it'));
  const avg=L.length?L.reduce((s,x)=>s+x.n,0)/L.length:0;
  return {L, played:played.length, avg, max:Math.max(0,...L.map(x=>x.n))};
}

/* ============================================================
   Formazione 5-1, rotazioni e statistiche in partita
   ============================================================ */
function roleKey(r){ r=(r||'').toLowerCase();
  if(/palleg|alzat/.test(r)) return 'P'; if(/oppost/.test(r)) return 'O'; if(/centr/.test(r)) return 'C';
  if(/liber/.test(r)) return 'L'; if(/banda|schiacc|laterale/.test(r)) return 'B'; return ''; }
const SLOTS=[['P','Palleggiatore'],['O','Opposto'],['B1','Banda 1'],['B2','Banda 2'],['C1','Centrale 1'],['C2','Centrale 2']];
const SLOT_ROLE={P:'P',O:'O',B1:'B',B2:'B',C1:'C',C2:'C',L:'L'};
const ROLE_COL={P:'#7b5cc4',O:'#d64a5a',B:'#2f6fb8',C:'#e07b22',L:'#22a05a'};
const ORDER=['P','B1','C1','O','B2','C2'];          // zone 1..6 con il palleggiatore in zona 1
const ROTNAME=['P1','P6','P5','P4','P3','P2'];
const ZXY={1:[240,205],2:[240,70],3:[150,70],4:[60,70],5:[60,205],6:[150,205]};
function rotAt(k){ let z=[...ORDER]; for(let i=0;i<((k%6)+6)%6;i++) z=[z[1],z[2],z[3],z[4],z[5],z[0]]; return z; }   // z[0]=zona 1 ... z[5]=zona 6
function getForm(m){ const f=Object.assign({P:'',O:'',B1:'',B2:'',C1:'',C2:'',L:'',libero:false,start:0}, m.formazione||{}); if(noLibero()) f.libero=false; return f; }
function formOk(f){ return SLOTS.every(([s])=>f[s]); }
function athShort(id){ const a=getAt(id); if(!a) return '?'; const base=a.cognome||a.nome||'?';
  const same=db.athletes.filter(x=>x.id!==a.id && (x.cognome||x.nome)===base); if(!same.length) return base;
  const ini=(a.nome||'')[0]||''; return same.some(x=>((x.nome||'')[0]||'')===ini) ? base+' '+(a.numeroMaglia||a.nome||'') : base+' '+ini+'.'; }
function athNum(id){ const a=getAt(id); return a ? (a.numeroMaglia || ((a.nome||'')[0]||'')+((a.cognome||'')[0]||'')) : '?'; }
/* posizioni di gioco dopo il servizio: avanti B4 C3 P/O2, dietro P/O1 B6 C5 */
function playZone(slot, front){ const r=SLOT_ROLE[slot]; if(front) return r==='B'?4:r==='C'?3:2; return r==='B'?6:r==='C'?5:1; }
function courtSVG(f, k, mode, opt={}){
  const z=rotAt(k), who=opt.who||(s=>f[s]), W=300, H=opt.serve?330:300;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="20" width="270" height="270" fill="#f4d3a1" stroke="#fff" stroke-width="3"/><rect x="15" y="20" width="270" height="90" fill="#efc387"/>
    <line x1="15" y1="110" x2="285" y2="110" stroke="#fff" stroke-width="2.5"/><line x1="5" y1="20" x2="295" y2="20" stroke="#1f2a44" stroke-width="5"/><text x="150" y="13" text-anchor="middle" font-size="10" fill="#666">rete</text>`;
  const pts=[];
  z.forEach((slot,i)=>{ const zone=i+1, front=[2,3,4].includes(zone);
    let pos=ZXY[zone];
    if(mode==='gioco') pos=ZXY[playZone(slot,front)];
    let sl=slot;
    if(f.libero && f.L && SLOT_ROLE[slot]==='C' && !front && !(zone===1 && opt.serve)) sl='L';
    pts.push({slot:sl, zone, front, pos}); });
  if(mode==='partenza'){   // il palleggiatore va a rete per alzare
    const p=pts.find(x=>x.slot==='P');
    if(p && !(p.zone===2||p.zone===3)) s+=`<path d="M${p.pos[0]} ${p.pos[1]} L 200 44" stroke="#1e9e5a" stroke-width="3" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)"/>`;
    s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e9e5a"/></marker></defs>`;
  }
  for(const p of pts){
    let [x,y]=p.pos; if(opt.serve && p.zone===1 && mode==='partenza'){ y=312; }
    const r=SLOT_ROLE[p.slot], id=who(p.slot), sel=opt.sel && id===opt.sel;
    s+=`<g ${opt.click?`data-pick="${esc(id)}" style="cursor:pointer"`:''}><circle cx="${x}" cy="${y}" r="21" fill="${ROLE_COL[r]}" stroke="${sel?'#e07b22':'#fff'}" stroke-width="${sel?5:2.5}"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${esc(id?athNum(id):p.slot)}</text>
      <text x="${x}" y="${y+35}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2a44">${esc(id?athShort(id):'')}</text>${id&&getAt(id)&&sexOf(getAt(id))?`<circle cx="${x+17}" cy="${y-15}" r="8" fill="#fff" stroke="#1f2a44" stroke-width="1"/><text x="${x+17}" y="${y-11.5}" text-anchor="middle" font-size="10" font-weight="800" fill="${isF(getAt(id))?'#c2185b':'#1f4f8f'}">${isF(getAt(id))?'D':'U'}</text>`:''}</g>`;
  }
  if(opt.serve && mode==='partenza') s+=`<text x="285" y="326" text-anchor="end" font-size="10.5" fill="#8a5a00" font-weight="700">batte</text>`;
  return s+'</svg>';
}
function formOptions(m, f, slot){
  const conv=convocati(m), pool=conv.length?conv:db.athletes.filter(a=>a.iscritto);
  const want=SLOT_ROLE[slot], used=new Set(Object.entries(f).filter(([k,v])=>k!==slot && v && SLOTS.concat([['L']]).some(([s])=>s===k)).map(([,v])=>v));
  const fit=pool.filter(a=>roleKey(a.ruolo)===want), fit2=pool.filter(a=>roleKey(a.ruolo)!==want && roleKey(a.ruolo2)===want), other=pool.filter(a=>!fit.includes(a) && !fit2.includes(a));
  const o=a=>`<option value="${a.id}" ${f[slot]===a.id?'selected':''}>${esc((a.numeroMaglia?a.numeroMaglia+' · ':'')+fullName(a))} (${isF(a)?'D':isM(a)?'U':'?'})${used.has(a.id)?' – già in campo':''}</option>`;
  const extra=f[slot] && !pool.some(a=>a.id===f[slot]) && getAt(f[slot]) ? o(getAt(f[slot])) : '';
  return `<option value="">—</option>${extra}${fit.length?`<optgroup label="Ruolo principale">${fit.map(o).join('')}</optgroup>`:''}${fit2.length?`<optgroup label="Secondo ruolo">${fit2.map(o).join('')}</optgroup>`:''}${other.length?`<optgroup label="Altri">${other.map(o).join('')}</optgroup>`:''}`;
}
function autoForm(m){
  const f=getForm(m), conv=convocati(m), pool=(conv.length?conv:db.athletes.filter(a=>a.iscritto));
  const ref=m.data||'9999-12-31', pres=a=>{ const st=absStats(a.id, ref); return st.n-st.ass; };
  const order=['P','O','C1','C2','B1','B2'];   // prima i ruoli con meno scelta
  let best=null;
  for(const first of (isMixed()?['F','M']:[''])){
    const sexFor=slot=>{ if(!first) return ''; const i=ORDER.indexOf(slot); return i%2===0?first:(first==='F'?'M':'F'); };
    const used=new Set(), res={}; let score=0, miss=0, second=[];
    for(const slot of order){
      const want=SLOT_ROLE[slot], sx=sexFor(slot);
      const c=pool.filter(a=>!used.has(a.id) && (sx ? sexOf(a)===sx : !wrongSex(a))).map(a=>({a, fit:roleKey(a.ruolo)===want?2:roleKey(a.ruolo2)===want?1:0, p:pres(a)}))
        .sort((x,y)=>(y.fit-x.fit)||(y.p-x.p))[0];
      if(c){ res[slot]=c.a.id; used.add(c.a.id); score+=c.fit*10+c.p; if(c.fit===1) second.push(athShort(c.a.id)+' come '+SLOTS.find(x=>x[0]===slot)[1].replace(/ \d$/,'')); if(!c.fit) miss++; }
      else { res[slot]=''; miss+=2; }
    }
    score-=miss*25;
    if(!best || score>best.score) best={res, score, second, miss};
  }
  Object.assign(f, best.res); m.formazione=f; touchMatch(m);
  { const fp=$('#form-panel'); if(fp) fp.innerHTML=formPanelHTML(m); }
  toast(best.miss ? 'Formazione proposta: controlla i posti segnalati' : 'Formazione proposta'+(best.second.length?' · '+best.second.join(', '):''));
}
function formWarn(m,f){
  const w=[], ids=SLOTS.map(([s])=>f[s]).concat(f.libero?[f.L]:[]).filter(Boolean), conv=new Set(m.convocati||[]);
  if(new Set(ids).size<ids.length) w.push('la stessa persona è in due posti');
  if(conv.size && ids.some(id=>!conv.has(id))) w.push('c\'è chi non è tra i convocati');
  const miss=SLOTS.filter(([s])=>!f[s]).map(([,l])=>l); if(miss.length) w.push('manca: '+miss.join(', '));
  if(!isMixed()){ const wr=ids.map(getAt).filter(a=>a && wrongSex(a)); if(wr.length) w.push((teamGen()==='F'?'in squadra femminile c\'è un uomo: ':'in squadra maschile c\'è una donna: ')+wr.map(a=>athShort(a.id)).join(', ')); }
  if(!miss.length && isMixed()){ const sx=ORDER.map(s=>{ const a=getAt(f[s]); return a?sexOf(a):''; });
    if(sx.some(x=>!x)) w.push('a qualcuno manca il sesso in anagrafica');
    else if(!sx.every((x,i)=>x!==sx[(i+1)%6])) w.push('in campo uomini e donne devono essere alternati (3 e 3): nell\'ordine Palleggiatore, Banda 1, Centrale 1, Opposto, Banda 2, Centrale 2 si alternano uomo e donna'); }
  return w;
}
function formPanelHTML(m){

function rotCardsHTML(m, f){

function statTable(evs, played, ids){
  const P={}; const g=id=>P[id]||(P[id]={bat:0,ace:0,batE:0,ric:0,ricP:0,ricG:0,ricE:0,att:0,attP:0,attE:0,mur:0,dif:0,err:0,set:0});

    if(e.k==='ric'){ p.ric++; if(e.v==='#') p.ricP++; if(e.v==='#'||e.v==='+') p.ricG++; if(e.v==='=') p.ricE++; }
    if(e.k==='att'){ p.att++; if(e.v==='#') p.attP++; if(e.v==='=') p.attE++; }
    if(e.k==='mur' && e.v==='#') p.mur++;
    if(e.k==='dif' && e.v==='+') p.dif++;
    if(e.k==='err' || (e.k==='dif' && e.v==='=')) p.err++;
  }
  for(const [id,n] of Object.entries(played||{})) g(id).set=n;
  const pc=(a,b)=>b?Math.round(100*a/b)+'%':'—';
  const rows=Object.entries(P).filter(([id])=>!ids || ids.has(id)).map(([id,p])=>({a:getAt(id), p, pts:p.ace+p.attP+p.mur})).filter(x=>x.a).sort((x,y)=>y.pts-x.pts || fullName(x.a).localeCompare(fullName(y.a),'it'));
  if(!rows.length) return '<div class="muted">Nessuna statistica registrata.</div>';
  return `<div style="overflow:auto"><table class="atable stt"><thead><tr><th>Atleta</th><th class="n" title="Set giocati">Set</th><th class="n">Punti</th><th class="n" title="Battute totali / ace / errori">Battute</th><th class="n" title="Battute sbagliate">Err. batt.</th><th class="n" title="Ricezioni totali">Ricez.</th><th class="n" title="Ricezioni perfette o positive">Ric. +</th><th class="n" title="Ricezioni perfette">Ric. #</th><th class="n" title="Attacchi totali / punti / errori">Attacchi</th><th class="n" title="(punti - errori) / attacchi">Effic. att.</th><th class="n">Muri</th><th class="n">Difese</th><th class="n" title="Falli, invasioni, errori in difesa">Errori</th></tr></thead><tbody>
    ${rows.map(({a,p,pts})=>`<tr><td style="white-space:nowrap">${avatarHTML(a,22)}<b>${esc(fullName(a))}</b></td><td class="n">${p.set||'—'}</td><td class="n"><b>${pts}</b></td><td class="n">${p.bat} / ${p.ace} / ${p.batE}</td><td class="n">${pc(p.batE,p.bat)}</td><td class="n">${p.ric}</td><td class="n">${pc(p.ricG,p.ric)}</td><td class="n">${pc(p.ricP,p.ric)}</td><td class="n">${p.att} / ${p.attP} / ${p.attE}</td><td class="n">${p.att?Math.round(100*(p.attP-p.attE)/p.att)+'%':'—'}</td><td class="n">${p.mur}</td><td class="n">${p.dif}</td><td class="n">${p.err}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">Battute: totali / ace / errori · Ric. +: perfette o positive · Effic. att.: (punti − errori) ÷ attacchi.</p>`;
}

function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getCal(){
  let c={}; try{ c=JSON.parse(db.settings.calendarioAllenamenti||'{}')||{}; }catch(e){ c={}; }
  if(!c.giorni) c.giorni={'3':'','0':''};          // mercoledì e domenica

function trainingsSorted(){ return [...db.trainings].sort((a,b)=>(a.data+(a.ora||'')).localeCompare(b.data+(b.ora||''))); }
function isRecorded(t){ return !t.annullato && Object.keys(t.presenze||{}).length>0; }
/* assenze negli ultimi n allenamenti con presenze segnate, prima della data indicata (esclusa) */
function absStats(aid, beforeISO, n=5){
  const L=trainingsSorted().filter(t=>isRecorded(t) && t.data<beforeISO).slice(-n);
  let ass=0, giu=0;
  const marks=L.map(t=>{ const s=t.presenze[aid]||'A'; if(s!=='P'){ ass++; if(s==='G') giu++; } return s; });
  return {n:L.length, ass, giu, marks};

function seasonPct(aid){
  const L=db.trainings.filter(t=>isRecorded(t) && t.data<=todayISO()); if(!L.length) return null;
  return Math.round(100*L.filter(t=>t.presenze[aid]==='P').length/L.length);

  return `<span class="absb ${cls}" title="${esc(tip)}"><span class="dots">${st.marks.map(m=>`<i class="dot d${m}"></i>`).join('')}</span>${st.ass}/${st.n}</span>`;
}
function regAthletes(){ return db.athletes.filter(a=>ui.pAll || a.iscritto).sort((x,y)=>(x.cognome||'').localeCompare(y.cognome||'','it') || (x.nome||'').localeCompare(y.nome||'','it')); }

  const rows=A.map(a=>{ const st=absStats(a.id,'9999-12-31'), pct=seasonPct(a.id);
    return `<tr><td class="sticky">${avatarHTML(a,26)}<b>${esc(fullName(a))}</b>${a.iscritto?'':' <span class="muted" style="font-size:12px">(non iscritto)</span>'}</td>${T.map(t=>{

  return `<div class="regwrap"><table class="reg"><thead><tr><th class="sticky">Atleta</th>${head}<th class="n">Presenze<br>stagione</th><th class="n">Assenze<br>ultimi 5</th></tr></thead>

/* ===== Referto gara ===== */
function refSets(m){ return (m.referto && Array.isArray(m.referto.sets)) ? m.referto.sets : []; }
function refGet(m){ if(!m.referto || !Array.isArray(m.referto.sets)) m.referto={sets:[]}; return m.referto; }
function refHas(m){ return refSets(m).some(s=>(s.ev||[]).some(e=>e==='N'||e==='L')); }
function refTarget(i){ return i>=4?15:25; }
function refReplay(s){
  const our=[...(s.our||[])], opp=s.opp?[...s.opp]:null; let k=0, kl=0, srv=s.firstServe||'noi', noi=0, loro=0, closed=false;
  const si=s.pal?our.indexOf(s.pal):-1;
  const lab=()=>si>=0?'P'+(((si-k)%6+6)%6+1):'R'+(k+1);
  const rl=[], to=[], subs=[];
  for(const e of s.ev||[]){
    if(e==='N'||e==='L'){
      const r={w:e, srv, rot:lab(), k, kl, sv: srv==='noi'?our[0]:(opp?opp[0]:null)};
      if(e==='N'){ noi++; if(srv==='loro'){ our.push(our.shift()); k=(k+1)%6; srv='noi'; } }
      else { loro++; if(srv==='noi'){ if(opp) opp.push(opp.shift()); kl=(kl+1)%6; srv='loro'; } }
      r.noi=noi; r.loro=loro; rl.push(r);
    } else if(e==='TN'||e==='TL') to.push({who:e==='TN'?'noi':'loro', at:rl.length, noi, loro});
    else if(e==='X') closed=true;
    else if(/^S[NL]\|/.test(e)){ const [t,o,n]=e.split('|'), arr=t==='SN'?our:opp; if(arr){ const j=arr.indexOf(o); if(j>=0) arr[j]=n; } subs.push({who:t==='SN'?'noi':'loro', out:o, in:n, noi, loro}); }
  }
  return {rl, to, subs, our, opp, k, kl, srv, noi, loro, rot:lab(), closed};
}
function refOver(R,i){ if(R.closed) return true; const t=refTarget(i); return (R.noi>=t||R.loro>=t) && Math.abs(R.noi-R.loro)>=2; }
function refScores(m){ return refSets(m).map((s,i)=>{ const R=refReplay(s); return refOver(R,i)?{noi:R.noi, loro:R.loro}:null; }).filter(Boolean); }
function refWins(m){ const S=refScores(m); const w=S.filter(x=>x.noi>x.loro).length; return {noi:w, loro:S.length-w}; }
function refMatchOver(m){ const w=refWins(m); return w.noi>=3||w.loro>=3; }
function refRole(a){ const k=a&&roleKey(a.ruolo); return k?' ('+k+')':''; }
function refName(id){ const a=getAt(id); if(!a) return '?'; return (a.numeroMaglia?a.numeroMaglia+' ':'')+athShort(id); }
function refPool(m){ const c=convocati(m); const ids=new Set(c.map(a=>a.id)); return [...c, ...db.athletes.filter(a=>a.iscritto && !ids.has(a.id)).sort((a,b)=>fullName(a).localeCompare(fullName(b)))]; }
function refDefaultLineup(m, i){
  const S=refSets(m), prev=S[i-1]||S[S.length-1];
  if(prev && prev.our) return {our:[...prev.our], pal:prev.pal||'', opp:prev.opp?[...prev.opp]:null, firstServe: i>0&&i<4&&prev.firstServe ? (prev.firstServe==='noi'?'loro':'noi') : 'noi'};
  const f=getForm(m); let our=['','','','','',''], pal='';
  if(formOk(f)){ const z=rotAt(f.start||0); our=z.map(sl=>f[sl]||''); pal=f.P||''; }
  return {our, pal, opp:null, firstServe:'noi'};
}
function refAutoPal(our){ const P=our.filter(id=>{ const a=getAt(id); return a && roleKey(a.ruolo)==='P'; }); return P.length===1?P[0]:''; }

    + (s && i===S.length-1 && refOver(refReplay(s),i) && !refMatchOver(m) ? `<button data-action="rf-newset">＋ Set ${S.length+1}</button>`:'');

/* --- analisi --- */
function refCollect(ms){ const L=[]; ms.forEach(m=>refSets(m).forEach((s,i)=>{ const R=refReplay(s); if(R.rl.length) L.push({m,s,i,R}); })); return L; }
function refAnalyze(L){
  const rot={}, srv={}, osrv={}; let so=[0,0], br=[0,0], pf=0, ps=0, runN=0, runL=0, big=0; const tos=[];
  const rk=k=>rot[k]=rot[k]||{rcv:0,rcvW:0,sv:0,svW:0,pf:0,ps:0};
  L.forEach(({s,i,R,m})=>{
    let cur=null, curN=0, curL=0;
    const flush=()=>{ if(!cur) return; const T=cur.t==='noi'?srv:osrv; const x=T[cur.id]=T[cur.id]||{turns:0,pts:0,max:0}; x.turns++; x.pts+=cur.p; x.max=Math.max(x.max,cur.p); cur=null; };
    R.rl.forEach((r,j)=>{
      const o=rk(r.rot), won=r.w==='N';
      if(won){ pf++; o.pf++; } else { ps++; o.ps++; }
      if(r.srv==='loro'){ so[1]++; o.rcv++; if(won){ so[0]++; o.rcvW++; } } else { br[1]++; o.sv++; if(won){ br[0]++; o.svW++; } }
      // turni di battuta
      const id=r.sv; if(id!=null && id!==''){ if(!cur || cur.t!==r.srv || cur.id!==id){ flush(); cur={t:r.srv,id,p:0}; } if((r.srv==='noi')===won) cur.p++; } else flush();
      // parziali
      if(won){ curN++; if(curL>=4) big++; curL=0; runN=Math.max(runN,curN); } else { curL++; curN=0; runL=Math.max(runL,curL); }
    });
    flush(); if(curL>=4) big++;
    R.to.forEach(t=>{ const nx=R.rl.slice(t.at,t.at+3); if(!nx.length) return; tos.push({m,set:i+1,who:t.who,noi:t.noi,loro:t.loro,w:nx.filter(r=>r.w==='N').length,n:nx.length}); });
  });
  return {rot, srv, osrv, so, br, pf, ps, runN, runL, big, tos, n:L.length};
}
const pc=(a,b)=>b?Math.round(a*100/b):null;
function refBar(a,b,good){ const p=pc(a,b); if(p===null) return '<span class="muted">—</span>';
  const col=p>=good?'#22a05a':p>=good-15?'#e0a422':'#d64a5a';
  return `<div class="rf-bar"><div class="b"><i style="width:${p}%;background:${col}"></i></div><b>${p}%</b><small>${a}/${b}</small></div>`; }
function refRotOrder(keys){ const P=['P1','P6','P5','P4','P3','P2'].filter(k=>keys.includes(k)); return [...P, ...keys.filter(k=>!P.includes(k)).sort()]; }
function refInsights(A, withOpp){
  const I=[], rows=Object.entries(A.rot);
  const rc=rows.filter(([k,o])=>o.rcv>=4).map(([k,o])=>[k,o.rcvW/o.rcv,o]).sort((a,b)=>a[1]-b[1]);
  if(rc.length>=2){ const [k,p,o]=rc[0]; I.push(['bad',`Rotazione più difficile in ricezione: <b>${k}</b> — cambio palla ${Math.round(p*100)}% (${o.rcvW} su ${o.rcv}).`]);
    const [k2,p2,o2]=rc[rc.length-1]; I.push(['good',`In ricezione rendete meglio in <b>${k2}</b>: ${Math.round(p2*100)}% (${o2.rcvW} su ${o2.rcv}).`]); }
  const bk=rows.filter(([k,o])=>o.sv>=4).map(([k,o])=>[k,o.svW/o.sv,o]).sort((a,b)=>b[1]-a[1]);
  if(bk.length>=2){ const [k,p,o]=bk[0]; I.push(['good',`Più punti in battuta (break) in <b>${k}</b>: ${Math.round(p*100)}% (${o.svW} su ${o.sv}).`]); }
  const sv=Object.entries(A.srv).filter(([id,x])=>x.turns>=2).map(([id,x])=>[id,x.pts/x.turns,x]).sort((a,b)=>b[1]-a[1]);
  if(sv.length) I.push(['good',`Battitore più efficace: <b>${esc(refName(sv[0][0]))}</b> — ${sv[0][2].pts} punti in ${sv[0][2].turns} turni (serie massima ${sv[0][2].max}).`]);
  const os=Object.entries(A.osrv).filter(([n,x])=>x.turns>=2).map(([n,x])=>[n,x.pts/x.turns,x]).sort((a,b)=>b[1]-a[1]);
  if(withOpp && os.length && os[0][2].pts>=3) I.push(['bad',`Il loro battitore più pericoloso: <b>n° ${esc(os[0][0])}</b> — ${os[0][2].pts} punti in ${os[0][2].turns} turni.`]);
  const tn=A.tos.filter(t=>t.who==='noi'); if(tn.length){ const w=tn.reduce((s,t)=>s+t.w,0), n=tn.reduce((s,t)=>s+t.n,0); I.push([w*2>=n?'good':'bad',`Dopo i vostri time-out: ${w} punti su ${n} nei 3 scambi successivi.`]); }
  if(A.big) I.push(['bad',`Parziali subiti di 4 o più punti di fila: <b>${A.big}</b> (il più lungo: ${A.runL}).`]);
  return I;
}
function refAnalysisHTML(L, opt={}){
  const A=refAnalyze(L); if(!A.n) return '';
  const keys=refRotOrder(Object.keys(A.rot)), I=refInsights(A);
  const rotT=`<table class="rf-t"><thead><tr><th>Rot.</th><th>Cambio palla<span class="hs"> (in ricezione)</span></th><th>Break<span class="hs"> (in battuta)</span></th><th class="n">Saldo</th></tr></thead><tbody>
    ${keys.map(k=>{ const o=A.rot[k], d=o.pf-o.ps; return `<tr><td><b>${k}</b></td><td>${refBar(o.rcvW,o.rcv,55)}</td><td>${refBar(o.svW,o.sv,40)}</td><td class="n"><b style="color:${d>0?'#22a05a':d<0?'#d64a5a':'inherit'}">${d>0?'+':''}${d}</b></td></tr>`; }).join('')}</tbody></table>`;
  const sv=Object.entries(A.srv).sort((a,b)=>b[1].pts/b[1].turns-a[1].pts/a[1].turns);
  const svT=sv.length?`<table class="rf-t"><thead><tr><th>Battitore</th><th class="n">Turni</th><th class="n">Punti</th><th class="n">Media</th><th class="n hs">Serie max</th></tr></thead><tbody>
    ${sv.map(([id,x])=>`<tr><td>${esc(refName(id))}</td><td class="n">${x.turns}</td><td class="n">${x.pts}</td><td class="n"><b>${(x.pts/x.turns).toFixed(1)}</b></td><td class="n hs">${x.max}</td></tr>`).join('')}</tbody></table>`:'';
  const os=!opt.match?[]:Object.entries(A.osrv).sort((a,b)=>b[1].pts-a[1].pts).slice(0,6);
  const osT=os.length?`<h3 class="rf-h">I loro battitori</h3><table class="rf-t"><thead><tr><th>N°</th><th class="n">Turni</th><th class="n">Punti fatti</th><th class="n">Serie max</th></tr></thead><tbody>
    ${os.map(([n,x])=>`<tr><td><b>${esc(n)}</b></td><td class="n">${x.turns}</td><td class="n">${x.pts}</td><td class="n">${x.max}</td></tr>`).join('')}</tbody></table>`:'';
  const toT=opt.match && A.tos.length?`<h3 class="rf-h">Time-out</h3><table class="rf-t"><thead><tr><th>Set</th><th>Chi</th><th class="n">Sul</th><th class="n">3 scambi dopo</th></tr></thead><tbody>
    ${A.tos.map(t=>`<tr><td>${t.set}</td><td>${t.who==='noi'?'Noi':'Loro'}</td><td class="n">${t.noi}–${t.loro}</td><td class="n"><b style="color:${t.w*2>t.n?'#22a05a':t.w*2<t.n?'#d64a5a':'inherit'}">${t.w}–${t.n-t.w}</b></td></tr>`).join('')}</tbody></table>`:'';
  const worm=opt.match?L.map(x=>refWormHTML(x)).join(''):'';
  return `${I.length?`<ul class="rf-ins">${I.map(([c,t])=>`<li class="${c}">${t}</li>`).join('')}</ul>`:''}
    <div class="rf-kpi"><div><span>Punti</span><b>${A.pf}–${A.ps}</b></div><div><span>Cambio palla</span><b>${pc(A.so[0],A.so[1])??'—'}%</b><small>${A.so[0]}/${A.so[1]}</small></div><div><span>Break</span><b>${pc(A.br[0],A.br[1])??'—'}%</b><small>${A.br[0]}/${A.br[1]}</small></div><div><span>Serie max</span><b>${A.runN} / ${A.runL}</b><small>noi / loro</small></div></div>
    <h3 class="rf-h">Rotazioni</h3>${rotT}
    ${svT?`<h3 class="rf-h">Battitori</h3>${svT}`:''}${osT}${toT}
    ${worm?`<h3 class="rf-h">Andamento dei set</h3><div class="muted" style="font-size:12px;margin-bottom:4px">Verde sopra la linea: siete avanti · rosso sotto: sono avanti loro · TO: time-out</div><div class="rf-worms">${worm}</div>`:''}
    <p class="rf-note">Cambio palla: punti vinti quando ricevete (obiettivo indicativo 55% o più). Break: punti vinti quando battete voi (40% o più è buono). P1…P6 indicano la zona del palleggiatore.</p>`;
}
function refWormHTML({s,i,R}){
  const n=R.rl.length; if(!n) return ''; const W=320, H=84, mid=H/2, mx=Math.max(4,...R.rl.map(r=>Math.abs(r.noi-r.loro))), sx=W/n, sy=(mid-6)/mx;
  const pts=[[0,mid],...R.rl.map((r,j)=>[(j+1)*sx, mid-(r.noi-r.loro)*sy])];
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=`0,${mid} ${line} ${W},${mid}`;
  const to=R.to.map(t=>`<line x1="${(t.at*sx).toFixed(1)}" x2="${(t.at*sx).toFixed(1)}" y1="2" y2="${H-2}" stroke="${t.who==='noi'?'#2f6fb8':'#8a94a6'}" stroke-dasharray="3 3"/><text x="${(t.at*sx+2).toFixed(1)}" y="10" font-size="8" fill="currentColor">TO</text>`).join('');
  return `<div class="rf-worm"><div class="c">Set ${i+1} · ${R.noi}–${R.loro}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Andamento del set ${i+1}">
    <defs><clipPath id="up${i}"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath><clipPath id="dn${i}"><rect x="0" y="${mid}" width="${W}" height="${mid}"/></clipPath></defs>
    <polygon points="${area}" fill="#22a05a" opacity=".25" clip-path="url(#up${i})"/><polygon points="${area}" fill="#d64a5a" opacity=".25" clip-path="url(#dn${i})"/>
    <line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="currentColor" opacity=".25"/>${to}
    <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg></div>`;
}
function refPanelHTML(m){
  const has=refHas(m), sc=refScores(m);
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><h2 style="margin:0">Referto</h2>${sc.length?`<span class="muted">${sc.map(x=>x.noi+'-'+x.loro).join(', ')}</span>`:''}<span style="flex:1"></span>
    ${refCanStats(m)?`<button class="btn sm ${has?'':'primary'}" data-action="ref-fromstats">📊 ${has?'Ricrea':'Crea'} dalle statistiche</button>`:''}${has?'<button class="btn sm" data-action="ref-wa">📤 WhatsApp</button><button class="btn sm" data-action="ref-print">🖨 Stampa</button>':''}
    <button class="btn sm ${has?'':'primary'}" data-action="ref-open">📝 ${has?'Modifica il referto':'Inserisci il referto'}</button></div>
    ${has?refAnalysisHTML(refCollect([m]),{match:true}):`<p class="muted" style="margin:0;font-size:13.5px">Nei giorni dopo la partita ricopi dal referto la formazione di partenza e la sequenza dei punti (basta premere +1 noi / +1 loro). L'app ricostruisce rotazioni e turni di battuta e ti mostra in quali rotazioni fate o subite punti, chi batte meglio, l'effetto dei time-out e i parziali. La formazione avversaria è facoltativa.</p>`}`;
}
function refBestServer(m){ const A=refAnalyze(refCollect([m])); const sv=Object.entries(A.srv).filter(([id,x])=>x.turns>=2 && x.pts>=2).sort((a,b)=>b[1].pts-a[1].pts); return sv[0]||null; }
function refSeasonHTML(ms){
  const L=refCollect(ms); if(!L.length) return ''; const nm=new Set(L.map(x=>x.m.id)).size;
  return `<div style="margin-top:22px"><div class="group-title" style="--c:#7b5cc4"><span class="bar"></span><h2>Analisi dei referti</h2><span class="muted">${nm} partit${nm===1?'a':'e'} · ${L.length} set</span></div>
    <div class="panel">${refAnalysisHTML(L)}</div></div>`;
}

const PROVA_GG=30, LIC_PUB={"key_ops":["verify"],"ext":true,"kty":"EC","x":"Anp9zTls15uqGWEbbqrfDcO-Eu-jivNXKo2ws2QL-Y4","y":"c8xFsu9O3C-hq8zOKLtpNetISUv1lHqHt25fcXmi2jE","crv":"P-256"};

  const lim=(()=>{ const d=parseISO(t); d.setDate(d.getDate()+60); return toISO(d); })();

    const pub=await crypto.subtle.importKey('jwk', LIC_PUB, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    const data=b64u(m[1]), ok=await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pub, b64u(m[2]), data);
    if(!ok) return {ok:false, err:'La chiave non è valida.'};

  }catch(e){ return {ok:false, err:'La chiave non è valida.'}; } }

/* ===== Tasto indietro ===== */
const NAV={stack:[], guard:false, back:false, pushed:false, fwdT:0};
const NAV_KEYS=['matchId','sessId','mTab','refSet','pDay','gBack','gq','gOpen','noteId','socTab'];
function navSnap(){ const o={view:ui.view}; NAV_KEYS.forEach(k=>{ if(ui[k]!==undefined) o[k]=ui[k]; }); return o; }
function navNeedsGuard(){ return (ui.view!=='home' && ui.view!=='benvenuto') || !$('#modal').classList.contains('hidden') || !!$('.picker.open'); }
/* La «barriera» è una sola voce nella cronologia sopra quella di partenza. Dopo un «indietro» non se ne crea una nuova
   (Chrome per Android salterebbe la voce di partenza e chiuderebbe l'app): si torna avanti sulla stessa barriera. */
function navPush(){ history.pushState({vd:Date.now()}, ''); NAV.guard=true; NAV.pushed=true; }
function navSync(){ try{
  if(!navNeedsGuard() || NAV.guard) return;
  if(NAV.pushed){ NAV.guard=true; history.forward(); clearTimeout(NAV.fwdT); NAV.fwdT=setTimeout(()=>{ if(!(history.state&&history.state.vs)) navPush(); }, 400); }
  else navPush();
}catch(e){} }
window.addEventListener('popstate', e=>{
  if(e.state && e.state.vs){ NAV.guard=true; clearTimeout(NAV.fwdT); return; }   // siamo tornati sulla barriera
  NAV.guard=false;
  if(document.body.classList.contains('locked')) return;
  if(!$('#modal').classList.contains('hidden')){ closeModal(); navSync(); return; }
  if($('.picker.open')){ actions['pick-close'](); navSync(); return; }
  // sotto-pagine dentro la stessa pagina: si chiude prima quella
  { const m=ui.matchId&&getMatch(ui.matchId), se=ui.sessId&&getSess(ui.sessId);
    if(ui.view==='partita' && ui.mEdit && m && m.data && m.avversario){ ui.mEdit=false; render(); navSync(); return; }
    if(ui.view==='referto' && ui.refForm && m && refSets(m).length){ ui.refForm=false; ui.refDraft=null; render(); navSync(); return; }
    if(ui.view==='sessione' && ui.sEdit && se && se.titolo){ ui.sEdit=false; render(); navSync(); return; } }
  if(ui.view==='home' || ui.view==='benvenuto'){ history.back(); return; }
  let prev=NAV.stack.pop();
  while(prev && prev.view===ui.view && prev.matchId===ui.matchId && prev.sessId===ui.sessId) prev=NAV.stack.pop();
  const p=prev||{view:'home'}, {view, ...rest}=p;
  NAV.back=true; go(view, rest); NAV.back=false;
  navSync();
});

function refCanStats(m){ const S=m.stats; return !!(S && S.ev && S.ev.some(e=>OUR_PT(e)||THEIR_PT(e)) && formOk(getForm(m))); }
function refFromStats(m){
  const S=m.stats, f=getForm(m), sets=[]; let subs={};
  const nS=Math.max(S.sets.length, ...S.ev.map(e=>e.s||1));
  for(let s=1;s<=nS;s++){
    const E=S.ev.filter(e=>(e.s||1)===s); if(!E.some(e=>OUR_PT(e)||THEIR_PT(e))) continue;
    const first=E[0], k0=first.prev&&first.prev.k!=null?+first.prev.k:(+f.start||0), sv0=first.prev?!!first.prev.servo:false;
    const who=sl=>subs[sl]!==undefined?subs[sl]:f[sl];
    const set={our:rotAt(k0).map(who), pal:who('P'), opp:null, firstServe:sv0?'noi':'loro', ev:[]};
    for(const e of E){
      if(e.k==='sub'){ if(e.out && e.a) set.ev.push('SN|'+e.out+'|'+e.a); if(e.slot) subs[e.slot]=e.a; }
      else if(OUR_PT(e)) set.ev.push('N'); else if(THEIR_PT(e)) set.ev.push('L');
    }
    if(s<=S.sets.length && !refOver(refReplay(set), s-1)) set.ev.push('X');

/* ===== Dati di prova ===== */
function demoShift(d, base){
  const n=Math.round((parseISO(todayISO())-parseISO(base))/864e5); if(!n) return d;
  const sh=iso=>{ if(!iso || !/^\d{4}-\d\d-\d\d$/.test(iso)) return iso; const x=parseISO(iso); x.setDate(x.getDate()+n); return toISO(x); };
  (d.matches||[]).forEach(m=>{ m.data=sh(m.data); });
  (d.trainings||[]).forEach(t=>{ t.data=sh(t.data); });
  (d.sessions||[]).forEach(s=>{ s.data=sh(s.data); });
  (d.athletes||[]).forEach(a=>{ a.scadenzaVisita=sh(a.scadenzaVisita); a.scadenzaDocumento=sh(a.scadenzaDocumento); a.dataNascita=sh(a.dataNascita); });
  return d;
}
const isDemo=x=>String(x&&x.id||'').startsWith('demo-');

    ...db.trainings.filter(isDemo).map(x=>'/api/allenamenti/'+x.id), ...(db.notes||[]).filter(isDemo).map(x=>'/api/note/'+x.id)];

const APP_VERSION='v10-2026-10-08';
function verLabel(v){ const m=String(v||'').match(/^v(\d+)-(\d{4})-(\d\d)-(\d\d)/); return m?`${m[1]} del ${+m[4]}/${+m[3]}/${m[2]}`:String(v||'?'); }
const verNum=v=>{ const m=String(v||'').match(/^v(\d+)/); return m?+m[1]:0; };
let swReg=null;
async function checkUpdate(){
  const box=$('#ver-msg'); const show=(c,t)=>{ if(box){ box.className='ver-msg '+c; box.textContent=t; } };
  if(!navigator.onLine){ show('', 'Sei offline: non posso controllare adesso.'); return; }
  show('', 'Controllo…');
  let online=null;
  try{ const r=await fetch('sw.js?fresh='+Date.now(), {cache:'no-store'}); const t=await r.text(); const m=t.match(/const VERSION = '([^']+)'/); online=m&&m[1]; }catch(e){}
  try{ if(swReg) await swReg.update(); }catch(e){}

const TEAM_FIELDS=['squadra','allenatore','colore','accento','logo','campionati','opzioni','calendarioAllenamenti'];
function teamsRaw(){ try{ const v=JSON.parse((db.settings&&db.settings.squadre)||'[]'); return Array.isArray(v)?v.filter(t=>t&&t.id):[]; }catch(e){ return []; } }
function teamMulti(){ return teamsRaw().length>1; }
function teamCur(){ const L=teamsRaw(); if(!L.length) return ''; const m=Store.getMeta('squadraAttiva'); return L.some(t=>t.id===m)?m:L[0].id; }
function teamFirst(){ const L=teamsRaw(); return L.length?L[0].id:''; }
function teamLabel(t, i){ return (t && t.squadra) || ('Squadra '+((i||0)+1)); }
const recTeam=r=>(r && r.squadra) || teamFirst();
const atTeams=a=>(a && Array.isArray(a.squadre) && a.squadre.length) ? a.squadre : [teamFirst()];
function teamApply(){
  if(!teamMulti()) return;
  const cur=teamCur(), t=teamsRaw().find(x=>x.id===cur)||{};
  TEAM_FIELDS.forEach(k=>{ db.settings[k]=t[k]!=null?t[k]:''; });
  db.athletes=db.athletes.filter(a=>atTeams(a).includes(cur));
  db.matches=db.matches.filter(m=>recTeam(m)===cur);
  db.trainings=db.trainings.filter(x=>recTeam(x)===cur);
  db.notes=(db.notes||[]).filter(n=>recTeam(n)===cur);
}
function teamStamp(method, url, body){
  if(!body || (method!=='PUT' && method!=='POST') || !teamMulti()) return;
  const cur=teamCur();
  if(/^\/api\/atleti\//.test(url)){ if(!body.squadre || !body.squadre.length) body.squadre=[cur]; }
  else if(/^\/api\/(partite|allenamenti|note)\//.test(url)){ if(!body.squadra) body.squadra=cur; }
  else if(url==='/api/allenamenti-multipli'){ (body.items||[]).forEach(t=>{ if(!t.squadra) t.squadra=cur; }); }
  else if(url==='/api/importa' && body.data){ const d=body.data;
    (d.athletes||[]).forEach(a=>{ if(!a.squadre || !a.squadre.length) a.squadre=[cur]; });
    ['matches','trainings','notes'].forEach(k=>(d[k]||[]).forEach(x=>{ if(!x.squadra) x.squadra=cur; })); }
  else if(url==='/api/impostazioni'){ const L=teamsRaw(), e=L.find(t=>t.id===cur); if(e){ TEAM_FIELDS.forEach(k=>{ e[k]=body[k]||''; }); body.squadre=JSON.stringify(L); } }
}
async function teamSwitch(id){ await Store.setMeta('squadraAttiva', id); NAV.stack=[]; await loadState(); applyBrand(); go('home'); toast('Squadra: '+(db.settings.squadra||'')); }

/* ===== Campionato PGS Milano ===== */
const PGS_API='https://volley.pgsmilano.org/api/';
let pgsBusy=false;
async function pgsGet(path){ const r=await fetch(PGS_API+path, {cache:'no-store'}); if(!r.ok) throw new Error('PGS '+r.status); return r.json(); }
function pgsCfg(){ const c=opz().pgs; return c && c.teamId ? c : null; }
function pgsKey(){ return 'pgs:'+(teamCur()||'1'); }
function pgsData(){ return Store.getMeta(pgsKey())||null; }
const pgsDate=s=>{ const m=String(s||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''; };
const pgsCampApp=()=>{ const c=pgsCfg(); return c ? (c.campApp || c.campNome || '') : ''; };
async function pgsRefresh(){
  const c=pgsCfg(); if(!c || pgsBusy) return null; pgsBusy=true;
  try{
    const [cal, cl, isc]=await Promise.all([pgsGet('calendari/campionato/'+c.camp), pgsGet('classifiche/campionato/'+c.camp), pgsGet('iscrizioni/campionato/'+c.camp+'/light')]);
    const inG=x=>x.categoria===c.cat && String(x.girone)===String(c.girone);
    const part=cal.filter(inG).map(p=>({id:p.id||p._id, g:String(p.giornata||''), n:String(p.numeroGara||''), data:p.data||'', ora:p.ora||'', casa:p.squadraCasaID, trasf:p.squadraTrasfertaID,
      sc:p.setVintiCasa, st:p.setVintiTrasferta, pc:p.parzialiCasa||[], pt:p.parzialiTrasferta||[]}));
    const clas=((cl.find(inG)||{}).squadre||[]).map(s=>({id:s.squadraID, pos:s.ranking, pti:(s.punteggio||0)-(s.penalita||0), v:s.partiteVinte||0, p:s.partitePerse||0, pa:s.partitePareggiate||0, sv:s.setVinti||0, sp:s.setPersi||0, pv:s.puntiVinti||0, pp:s.puntiPersi||0}))
      .sort((a,b)=>(a.pos||99)-(b.pos||99));
    const ids=new Set(part.flatMap(p=>[p.casa,p.trasf])); clas.forEach(s=>ids.add(s.id)); ids.add(c.teamId);
    const names={}; isc.forEach(s=>{ const id=s.id||s._id; if(ids.has(id)) names[id]=s.nomeSquadra; });
    const old=pgsData()||{}; let gyms=old.gyms||{}, gymsAt=old.gymsAt||0;
    if(!Object.keys(gyms).length || Date.now()-gymsAt>7*864e5){
      try{ const full=await pgsGet('iscrizioni/campionato/'+c.camp); gyms={};
        full.forEach(s=>{ const id=s.id||s._id; if(ids.has(id)) gyms[id]={presso:s.presso||'', indirizzo:s.indirizzo||'', citta:s.citta||''}; }); gymsAt=Date.now(); }catch(e){}
    }
    const d={at:Date.now(), part, clas, names, gyms, gymsAt};
    await Store.setMeta(pgsKey(), d);
    return d;
  } finally { pgsBusy=false; }
}
function pgsOurs(d,c){ return d.part.filter(p=>p.casa===c.teamId || p.trasf===c.teamId); }
async function pgsImport(createNew){
  const c=pgsCfg(), d=pgsData(); if(!c || !d) return {created:0, updated:0};
  const camp=pgsCampApp(); if(camp && !campDefs().includes(camp)) saveCampDefs([...campDefs(), camp]);
  let created=0, updated=0;
  for(const p of pgsOurs(d,c)){
    const home=p.casa===c.teamId, g=d.gyms[p.casa]||{}, data=pgsDate(p.data);
    const fields={data, ora:p.ora, avversario:d.names[home?p.trasf:p.casa]||'Avversario', inCasa:home, giornata:p.g, numeroGara:p.n};
    const place={palestra:(g.presso && g.citta && !g.presso.toUpperCase().includes(g.citta.toUpperCase()))?g.presso+' '+g.citta:(g.presso||g.citta||''), indirizzo:[g.indirizzo,g.citta].filter(Boolean).join(', ')};
    const hasRes=p.sc!=null && p.st!=null && (p.sc+p.st)>0, res=hasRes?`${p.sc}-${p.st}`:'', parz=hasRes?p.pc.map((x,i)=>x+'-'+(p.pt[i]??'')).join(' '):'';
    const oppN=String(fields.avversario).toLowerCase().replace(/[^a-z0-9]/g,''), near=x=>{ if(!x.data||!data) return false; const dd=Math.abs((parseISO(x.data)-parseISO(data))/864e5); const on=String(x.avversario||'').toLowerCase().replace(/[^a-z0-9]/g,''); return dd<=21 && on.length>=3 && (oppN.includes(on)||on.includes(oppN)) && !!x.inCasa===home; };
    let m=db.matches.find(x=>x.pgsId===p.id) || (p.n && db.matches.find(x=>!x.pgsId && x.numeroGara===p.n)) || (data && db.matches.find(x=>!x.pgsId && x.data===data)) || db.matches.find(x=>!x.pgsId && near(x));
    if(!m){ if(!createNew) continue;
      m=newMatch(); Object.assign(m, fields, place, {pgsId:p.id, competizione:camp}); if(hasRes){ m.risultato=res; m.parziali=parz; }
      await persist.match(m); created++; continue; }
    let ch=false; const set=(k,v)=>{ if(v!=='' && v!=null && m[k]!==v){ m[k]=v; ch=true; } };
    Object.entries(fields).forEach(([k,v])=>set(k,v));
    Object.entries(place).forEach(([k,v])=>{ if(!m[k] && v){ m[k]=v; ch=true; } });
    if(!m.pgsId){ m.pgsId=p.id; ch=true; }
    if(!m.competizione && camp){ m.competizione=camp; ch=true; }
    if(hasRes){ set('risultato',res); set('parziali',parz); }
    if(ch){ m.updatedAt=Date.now(); await persist.match(m); updated++; }
  }
  return {created, updated};
}
function pgsAuto(){
  const c=pgsCfg(); if(!c || pgsBusy || !navigator.onLine) return;
  const d=pgsData(); if(d && Date.now()-d.at<6*3600e3) return;
  pgsRefresh().then(async r=>{ if(!r) return; await pgsImport(false); if(ui.view==='partite') render(); }).catch(()=>{});
}

  return `<div class="panel" style="margin-top:14px" id="pgs-panel"><div class="pgs-h"><h2>🏆 Campionato PGS</h2><span class="muted">${esc(c.catNome||c.cat)} · girone ${esc(c.girone)} · ${esc(c.campNome||'')}${d?' · aggiornato '+pgsAgo(d.at):''}</span><span style="flex:1"></span>

async function pgsH2H(oppName){
  const c=pgsCfg(); if(!c) return; const op=pgsNorm(oppName);
  const myN=new Set([c.teamName, ...pgsAltList(c.altNomi)].map(pgsNorm).filter(Boolean));
  const opN=new Set([oppName, ...pgsAltList((c.oppAlt||{})[op])].map(pgsNorm).filter(Boolean));
  const cats=new Set(h2hCats(c)), inCat=s=>cats.has(s.categoria);
  toast('Cerco i precedenti sul sito della PGS…');
  try{
    // codice società: resta uguale anche quando la squadra cambia nome
    let mySoc=c.soc||'', opSoc='';
    try{ const cur=await pgsGet('iscrizioni/campionato/'+c.camp+'/light'); const me=cur.find(s=>(s.id||s._id)===c.teamId); if(me&&me.codiceSocieta) mySoc=me.codiceSocieta; const o=cur.find(s=>pgsNorm(s.nomeSquadra)===op); if(o&&o.codiceSocieta) opSoc=o.codiceSocieta; }catch(e){}
    if(opSoc && opSoc===mySoc) opSoc='';
    const camps=(await pgsGet('campionati/all')).filter(x=>x.codice!==c.camp).slice(-8);
    const list=[], seen=new Set();
    for(const cp of camps){
      let isc=[]; try{ isc=await pgsGet('iscrizioni/campionato/'+cp.codice+'/light'); }catch(e){ continue; }
      const isMe=s=>inCat(s) && (myN.has(pgsNorm(s.nomeSquadra)) || (!!mySoc && s.codiceSocieta===mySoc));
      const isOp=s=>inCat(s) && !isMe(s) && (opN.has(pgsNorm(s.nomeSquadra)) || (!!opSoc && s.codiceSocieta===opSoc));
      const mine=isc.filter(isMe), opps=new Map(isc.filter(isOp).map(s=>[s.id||s._id, s.nomeSquadra]));
      if(!mine.length || !opps.size) continue;
      for(const t of mine){ const tid=t.id||t._id; let cal=[]; try{ cal=await pgsGet('calendari/team/'+tid); }catch(e){ continue; }
        cal.filter(p=>opps.has(p.squadraCasaID)||opps.has(p.squadraTrasfertaID)).filter(p=>p.setVintiCasa!=null && (p.setVintiCasa+p.setVintiTrasferta)>0).forEach(p=>{
          const key=p.id||p._id||(p.data+p.squadraCasaID+p.squadraTrasfertaID); if(seen.has(key)) return; seen.add(key);
          const home=p.squadraCasaID===tid; list.push({camp:cp.nome, data:p.data, home, my:home?p.setVintiCasa:p.setVintiTrasferta, th:home?p.setVintiTrasferta:p.setVintiCasa, noi:t.nomeSquadra, loro:opps.get(home?p.squadraTrasfertaID:p.squadraCasaID)}); }); }
    }
    list.sort((a,b)=>pgsDate(b.data).localeCompare(pgsDate(a.data)));
    const all=Store.getMeta('pgsH2H')||{}; all[op]={at:Date.now(), list}; await Store.setMeta('pgsH2H', all);
    render(); toast(list.length?`Trovati ${list.length} precedenti`:'Nessun precedente nelle stagioni passate');
  }catch(e){ toast('Non riesco a raggiungere il sito della PGS'); }
}

function refRemind(){
  const td=todayISO(); return db.matches.filter(m=>m.data && m.data<=td && Math.round((parseISO(td)-parseISO(m.data))/864e5)<=10 && (matchSets(m)||m.stats&&m.stats.ev&&m.stats.ev.length) && !refHas(m) && !(opz().refNo||[]).includes(m.id));
}
/* ===== Sovrapposizioni tra squadre e agenda ===== */
const TEAM_PAL=['#2f6fb8','#e07b22','#22a05a','#7b5cc4','#d64a5a','#0891b2'];
function teamColor(t,i){ return (t&&t.accento)||TEAM_PAL[i%TEAM_PAL.length]; }
function agendaItems(days){
  const L=teamsRaw(); if(L.length<2) return [];
  const st=Store.fullState(), first=L[0].id, td=todayISO(), end=licAddDays(td, days), out=[];
  const tIdx=id=>Math.max(0,L.findIndex(t=>t.id===id));
  st.matches.filter(m=>m.data && m.data>=td && m.data<=end).forEach(m=>{ const t=m.squadra||first; out.push({k:'m', id:m.id, team:t, data:m.data, ora:m.ora||'', label:matchTitleTeam(m, L[tIdx(t)]), conv:m.convocati||[]}); });
  st.trainings.filter(x=>x.data && x.data>=td && x.data<=end && !x.annullato).forEach(x=>{ const t=x.squadra||first; out.push({k:'t', id:x.id, team:t, data:x.data, ora:x.ora||'', label:'Allenamento'}); });
  return out.sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
}
function matchTitleTeam(m,t){ const me=(t&&t.squadra)||'Noi', o=m.avversario||'?'; return m.inCasa?`${me} – ${o}`:`${o} – ${me}`; }
function teamConflicts(days){
  const L=teamsRaw(); if(L.length<2) return [];
  const st=Store.fullState(), first=L[0].id, items=agendaItems(days||45), out=[];
  st.athletes.filter(a=>a.iscritto && !a.cestino && (a.squadre||[]).length>1).forEach(a=>{
    const mine=items.filter(it=>a.squadre.includes(it.team) && (it.k==='t' || !it.conv.length || it.conv.includes(a.id)));
    const byD={}; mine.forEach(it=>{ (byD[it.data]=byD[it.data]||[]).push(it); });
    Object.entries(byD).forEach(([d,its])=>{ if(new Set(its.map(i=>i.team)).size>1 && its.some(i=>i.k==='m')) out.push({a, data:d, its}); });
  });
  return out.sort((x,y)=>x.data.localeCompare(y.data));
}

  try{ const r=await fetch('sw.js?fresh='+Date.now(), {cache:'no-store'}); const t=await r.text(); const m=t.match(/const VERSION = '([^']+)'/);
    if(m && verNum(m[1])>verNum(APP_VERSION)){ document.body.classList.add('has-upd'); window.APP_ONLINE_VER=m[1]; try{ if(swReg) await swReg.update(); }catch(e){} } }catch(e){}

function checksData(){
  const td=todayISO(), at=db.athletes.filter(a=>a.iscritto), S=[];
  const add=(t,items)=>{ if(items.length) S.push({t,items}); };
  add('Atleti senza visita medica valida', at.filter(a=>!a.scadenzaVisita || a.scadenzaVisita<td).map(a=>({l:fullName(a), s:a.scadenzaVisita?'scaduta il '+shortDate(a.scadenzaVisita):'manca', act:'edit-at', id:a.id})));
  add('Atleti senza numero di maglia', at.filter(a=>!a.numeroMaglia).map(a=>({l:fullName(a), act:'edit-at', id:a.id})));
  add('Atleti senza data di nascita', at.filter(a=>!a.dataNascita).map(a=>({l:fullName(a), act:'edit-at', id:a.id})));
  add('Atleti senza ruolo o senza sesso', at.filter(a=>!a.ruolo || !a.sesso).map(a=>({l:fullName(a), s:[!a.ruolo?'ruolo':'',!a.sesso?'sesso':''].filter(Boolean).join(' e ')+' da inserire', act:'edit-at', id:a.id})));
  add('Partite giocate senza risultato', db.matches.filter(m=>m.data && m.data<td && !matchSets(m)).map(m=>({l:matchTitle(m), s:shortDate(m.data), act:'open-match', id:m.id})));
  add('Risultato diverso da statistiche o referto', db.matches.filter(m=>resMismatch(m)).map(m=>{ const x=resMismatch(m); return {l:matchTitle(m), s:`scritto ${m.risultato} (${x.r.noi}-${x.r.loro} per noi), ${x.o.src==='stats'?'statistiche':'referto'} ${x.o.noi}-${x.o.loro} per noi`, act:'open-match', id:m.id}; }));
  add('Risultato scritto in modo non valido', db.matches.filter(m=>(m.risultato||'').trim() && m.data && m.data<td && (!resParse(m) || !matchOutcome(m))).map(m=>({l:matchTitle(m), s:'«'+m.risultato+'»: serve un risultato come 3-1 (una squadra a 3 set)', act:'open-match', id:m.id})));
  add('Partite senza data', db.matches.filter(m=>!m.data).map(m=>({l:matchTitle(m), act:'open-match', id:m.id})));
  add('Allenamenti passati senza presenze', db.trainings.filter(t=>t.data<td && t.data>=licAddDays(td,-60) && !t.annullato && !Object.keys(t.presenze||{}).length).map(t=>({l:'Allenamento del '+shortDate(t.data), act:'pd-go', id:t.id})));
  add('Sessioni senza esercizi', db.sessions.filter(s=>!(s.items||[]).length).map(s=>({l:s.titolo||'Sessione senza titolo', s:s.data?shortDate(s.data):'', act:'open-sess', id:s.id})));
  return S;
}

/* ===== Calendario per il telefono (.ics) ===== */
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsDT(d, t){ return d.replace(/-/g,'')+'T'+(t||'00:00').replace(':','')+'00'; }
function icsAdd(d, t, min){ const x=new Date(d+'T'+(t||'00:00')+':00'); x.setMinutes(x.getMinutes()+min); const p=n=>String(n).padStart(2,'0'); return `${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}T${p(x.getHours())}${p(x.getMinutes())}00`; }
function icsBuild(o){
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'), td=todayISO(), from=o.past?licAddDays(td,-120):td, team=db.settings.squadra||'Volleydesk', E=[];
  const ev=(uid, d, t, dur, sum, loc, desc)=>{ const allDay=!t; E.push(['BEGIN:VEVENT','UID:'+uid+'@volleydesk','DTSTAMP:'+now,
    allDay?'DTSTART;VALUE=DATE:'+d.replace(/-/g,''):'DTSTART:'+icsDT(d,t), allDay?'DTEND;VALUE=DATE:'+icsAdd(d,'00:00',1440).slice(0,8):'DTEND:'+icsAdd(d,t,dur),
    'SUMMARY:'+icsEsc(sum), loc?'LOCATION:'+icsEsc(loc):'', desc?'DESCRIPTION:'+icsEsc(desc):'', 'END:VEVENT'].filter(Boolean).join('\r\n')); };
  if(o.partite) db.matches.filter(m=>m.data && m.data>=from).forEach(m=>{
    const loc=[m.palestra, m.indirizzo].filter(Boolean).join(', ');

function generateTrainings(){
  const c=getCal(), days=Object.keys(c.giorni).map(Number);
  if(!days.length){ alert('Scegli almeno un giorno della settimana.'); return; }
  const d0=parseISO(c.dal), d1=parseISO(c.al);
  if(!d0 || !d1 || d1<d0){ alert('Controlla le date di inizio e di fine.'); return; }
  if((d1-d0)/864e5 > 400){ alert('Il periodo è troppo lungo: al massimo poco più di un anno.'); return; }
  const have=new Set(db.trainings.map(t=>t.data)), mdays=new Set(db.matches.map(m=>m.data).filter(Boolean));
  const items=[]; let skipped=0; const now=Date.now();
  for(let d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)){
    if(!days.includes(d.getDay())) continue;
    const iso=toISO(d); if(have.has(iso)) continue;
    if(c.saltaPartite && mdays.has(iso)){ skipped++; continue; }
    items.push({id:newId('al'), data:iso, ora:c.giorni[d.getDay()]||'', note:'', annullato:false, presenze:{}, createdAt:now, updatedAt:now});
  }
  if(!items.length){ toast(skipped?`Nessuna data nuova (saltate ${skipped} date con partita)`:'Il calendario è già completo'); return; }
  api('POST','/api/allenamenti-multipli',{items}).then(()=>{ db.trainings.push(...items); render(); toast(`Aggiunti ${items.length} allenamenti`+(skipped?` · saltate ${skipped} date con partita`:'')); }).catch(saveFail);
}

function pickAvatar(cb){
  const inp=$('#filepick'); inp.value=''; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const S=200, side=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=S;
        const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,S,S);
        x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);   // ritaglio quadrato al centro
        cb(c.toDataURL('image/jpeg',0.85)); };
      img.onerror=()=>alert('Immagine non leggibile.'); img.src=r.result; };
    r.readAsDataURL(f); };
  inp.click();
}


/* ============================================================
   Esercizi fisici: serie, ripetizioni, recupero
   ============================================================ */
function dosOn(d){ return !!(d && d.misura==='serie'); }
function dosShort(d){ if(!dosOn(d)) return ''; return `${d.serie||1} × ${d.ripetizioni||0}${d.unita==='sec'?'″':''}${d.perLato?' per lato':''}`; }
function dosFull(d){ if(!dosOn(d)) return '';
  return [`${d.serie||1} serie × ${d.ripetizioni||0} ${d.unita==='sec'?'secondi':'ripetizioni'}${d.perLato?' per lato':''}`, d.recupero?`recupero ${d.recupero}″`:'', d.carico||''].filter(Boolean).join(' · '); }
function estimateMin(d){
  if(!dosOn(d)) return null;
  const rep = d.unita==='sec' ? (d.ripetizioni||0) : (d.ripetizioni||0)*3;      // circa 3 secondi a ripetizione
  const work = rep*(d.perLato?2:1), n=Math.max(1,d.serie||1);
  return Math.max(1, Math.ceil((n*work + (n-1)*(d.recupero||0))/60));
}
function effDos(it){ const e=getEx(it.exId); return it.dosaggio || (e && e.dosaggio) || null; }
function dosPanelHTML(d){
  const ds=d.dosaggio||{}, on=dosOn(ds);
  const num=(n,l,v,min,max)=>`<label class="f">${l}<input type="number" name="${n}" min="${min}" max="${max}" value="${esc(v)}"></label>`;
  return `<div class="panel" id="dos-panel"><h2>Carico di lavoro</h2>
    <div class="seg"><label><input type="radio" name="misura" value="tempo" ${on?'':'checked'}> A tempo (minuti)</label><label><input type="radio" name="misura" value="serie" ${on?'checked':''}> A serie e ripetizioni</label></div>
    <div id="dos-box" class="grid g-dos ${on?'':'hidden'}">
      ${num('serie','Serie',ds.serie??3,1,20)}
      <label class="f">Ripetizioni o tempo<span style="display:flex;gap:6px"><input type="number" name="ripetizioni" min="1" max="600" value="${esc(ds.ripetizioni??12)}"><select name="unita" style="width:auto"><option value="rip" ${ds.unita==='sec'?'':'selected'}>ripetizioni</option><option value="sec" ${ds.unita==='sec'?'selected':''}>secondi</option></select></span></label>
      <div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)">Per lato<label class="sw"><input type="checkbox" name="perLato" ${ds.perLato?'checked':''}> Sì, per ogni lato</label></div>
      ${num('recupero','Recupero tra le serie (sec)',ds.recupero??45,0,600)}
      <label class="f">Elastico / carico<input type="text" name="carico" list="dl-carichi" value="${esc(ds.carico||'')}" placeholder="Scegli o scrivi"></label>
      <div class="dos-sum" id="dos-sum"></div>
    </div>
    <div class="grid g3" style="margin-top:12px"><label class="f">Distretto (parte del corpo)<input type="text" name="distretto" list="dl-distretti" value="${esc(d.distretto||'')}" placeholder="Es. Spalle, Core, Caviglie"></label></div>
  </div>`;
}
function readDos(){
  const f=$('#ex-form-edit'), v=n=>f.querySelector(`[name=${n}]`), int=(n,min)=>Math.max(min, parseInt(v(n).value,10)||0);
  return {misura:'serie', serie:int('serie',1), ripetizioni:int('ripetizioni',0), unita:v('unita').value, perLato:v('perLato').checked, recupero:int('recupero',0), carico:v('carico').value.trim()};
}
function updateDosUI(init){
  const f=$('#ex-form-edit'); if(!f || !$('#dos-panel')) return;
  const on=f.querySelector('[name=misura]:checked')?.value==='serie';
  $('#dos-box').classList.toggle('hidden', !on);
  if(!on){ $('#dos-sum').textContent=''; return; }
  const d=readDos(), est=estimateMin(d);
  if(!init) f.querySelector('[name=durata]').value=est;
  $('#dos-sum').innerHTML=`<b>${esc(dosFull(d))}</b> · durata stimata ≈ ${est} min, già inserita nel campo «Durata» (puoi correggerla)`;
}
function dosEditorHTML(it){
  const d=effDos(it); if(!dosOn(d)) return '';
  const inp=(k,min,max)=>`<input type="number" min="${min}" max="${max}" data-idos="${k}" data-uid="${it.uid}" value="${esc(d[k]??'')}">`;
  return `<div class="idos">Serie ${inp('serie',1,20)} × ${inp('ripetizioni',1,600)} ${d.unita==='sec'?'sec':'rip.'}${d.perLato?' per lato':''} · rec. ${inp('recupero',0,600)}″${d.carico?' · '+esc(d.carico):''}

}
function distSelectHTML(){
  const ds=[...new Set(db.exercises.map(e=>e.distretto).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));

function moveItem(uid,dir){
  const s=getSess(ui.sessId), i=s.items.findIndex(x=>x.uid===uid), j=i+dir;
  if(j<0||j>=s.items.length) return; [s.items[i],s.items[j]]=[s.items[j],s.items[i]]; touchSess(s,'items');
}

  if(a.closest('.sed')) return;
  const fn=actions[a.dataset.action]; if(fn){ e.preventDefault(); fn(a,e); }
});

document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='ex-q'){ ui.f.q=t.value; refreshExList(); return; }
  if(t.id==='at-q'){ ui.af.q=t.value; $('#at-rows').innerHTML=atRows(); return; }
  if(t.dataset.mf==='competizione' && t.value==='__new'){ const m=getMatch(ui.matchId); if(!m) return; const v=(prompt('Nome del nuovo campionato (es. Primaverile 2027):')||'').trim();
    if(v && v!==CAMP_NONE){ if(!campList().some(c=>c.name===v)) saveCampDefs([...campDefs(), v]); m.competizione=v; touchMatch(m); refreshMatch(m); }
    t.innerHTML=campOptionsHTML(m); return; }
  if(t.dataset.mf){ const m=getMatch(ui.matchId); if(!m) return; m[t.dataset.mf] = t.dataset.mf==='inCasa' ? t.value==='1' : t.value; touchMatch(m); refreshMatch(m, t.dataset.mf); return; }
  if(t.closest('#at-form')){ if(t.name==='dataNascita') refreshAtDerived(); return; }
  if(t.id==='pick-q'){ ui.pick.q=t.value; $('#plist').innerHTML=pickListHTML(getSess(ui.sessId)); return; }
  if(t.closest('#dos-panel')) updateDosUI();
  if(t.closest('#ex-form-edit') && !t.closest('.sed')){ markDirty(); return; }
  if(t.dataset.sf){ const s=getSess(ui.sessId); s[t.dataset.sf]=t.value; touchSess(s, t.dataset.sf==='oraInizio'?'times':null); if(t.dataset.sf==='titolo') $('.page-head h1').textContent=t.value||'Nuova sessione'; return; }
  if(t.dataset.idos){ const s=getSess(ui.sessId), it=s&&s.items.find(i=>i.uid===t.dataset.uid); if(!it) return;
    const d=Object.assign({}, effDos(it)); d[t.dataset.idos]=Math.max(t.dataset.idos==='recupero'?0:1, parseInt(t.value,10)||0);
    it.dosaggio=d; it.durata=estimateMin(d); const di=$(`[data-if=durata][data-uid="${it.uid}"]`); if(di) di.value=it.durata;
    touchSess(s,'times'); return; }
  if(t.dataset.if){ const s=getSess(ui.sessId), it=s.items.find(i=>i.uid===t.dataset.uid); if(!it) return;
    it[t.dataset.if] = t.dataset.if==='durata' ? (t.value===''?0:Math.max(0,Math.round(+t.value)||0)) : t.value;
    touchSess(s, t.dataset.if==='durata'?'times':null); autoGrow(t); return; }
  if(t.dataset.set){ db.settings[t.dataset.set]=t.value; if(t.dataset.set==='colore'||t.dataset.set==='accento') applyBrand(); clearTimeout(window._setT); window._setT=setTimeout(()=>{ persist.settings().then(()=>{ const i=$('#set-saved'); if(i){ i.textContent='✓ Salvato'; setTimeout(()=>i.textContent='',1500);} }).catch(saveFail); },400); }
});
document.addEventListener('input', e=>{ if(e.target.id==='g-q'){ ui.gq=e.target.value; const pos=e.target.selectionStart; render(); const i=$('#g-q'); if(i){ i.focus(); try{ i.setSelectionRange(pos,pos); }catch(_){} } } });
document.addEventListener('change', e=>{
  if(e.target.dataset.optv){ setOpz(e.target.dataset.optv, e.target.value); toast('Squadra '+genLabel()+': convocazioni e formazione si adeguano'); return; }
  if(e.target.dataset.pgs && ui.pgsS){ ui.pgsS[e.target.dataset.pgs]=e.target.value; if(!['campApp','altNomi'].includes(e.target.dataset.pgs)) pgsSetupRender(); return; }
  if(e.target.dataset.opt){ setOpz(e.target.dataset.opt, e.target.checked); toast(e.target.checked?'Fatto: niente libero':'Libero riattivato'); return; }
  if(e.target.dataset.rf!==undefined){ refFormChange(e.target); return; }
  if(e.target.dataset.qm!==undefined){ qmCount(); return; }
  if(e.target.dataset.exp){ ui.exp.sel[e.target.dataset.exp]=e.target.checked; return; }
  if(e.target.name==='exp-ex'){ ui.exp.exMode=e.target.value; return; }
  const t=e.target;
  if(t.id==='ex-form'){ ui.f.form=t.value; refreshExList(); }
  if(t.id==='ex-dist'){ ui.f.dist=t.value; refreshExList(); }
  if(t.id==='at-ruolo'){ ui.af.ruolo=t.value; $('#at-rows').innerHTML=atRows(); }
  if(t.id==='at-iscr'){ ui.af.iscr=t.value; $('#at-rows').innerHTML=atRows(); }
  if(t.id==='note-q'){ ui.nq=t.value; const q=t.value.toLowerCase().trim(), lb=ui.nl||''; $('#note-list').innerHTML=noteListHTML((db.notes||[]).filter(n=>(!lb||n.etichetta===lb)&&(!q||(n.titolo+' '+n.testo+' '+n.etichetta).toLowerCase().includes(q))).sort((a,b)=>(b.fissata-a.fissata)||(b.updatedAt-a.updatedAt))); return; }
  if(t.id==='at-sort'){ ui.af.sort=t.value; $('#at-rows').innerHTML=atRows(); }
  if(t.closest('#at-form') && t.name==='dataNascita') refreshAtDerived();
  if(t.dataset.conv){ const m=getMatch(ui.matchId); if(!m) return;
    if(t.checked){ const a0=getAt(t.dataset.conv); if(a0 && !visitaOk(a0,m) && !confirm(`${fullName(a0)}: ${visitaWhy(a0)}. Convocarlo comunque?`)){ t.checked=false; return; } } const s=new Set(m.convocati||[]); if(t.checked) s.add(t.dataset.conv); else s.delete(t.dataset.conv);
    m.convocati=db.athletes.filter(a=>s.has(a.id)).map(a=>a.id); touchMatch(m); refreshMatch(m,'conv'); return; }
  if(t.dataset.fs){ const m=getMatch(ui.matchId); if(!m) return; const f=getForm(m); const k=t.dataset.fs;
    f[k]= k==='libero' ? t.checked : k==='start' ? +t.value : t.value; m.formazione=f; touchMatch(m); $('#form-panel').innerHTML=formPanelHTML(m); return; }
  if(t.dataset.live==='k'){ const m=getMatch(ui.matchId), L=getStats(m).live; L.k=+t.value; markPlayed(m); touchMatch(m); rerenderLive(); return; }
  if(t.id==='cs-all'){ ui.csAll=t.checked; ui.csOpen=true; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.id==='p-all'){ ui.pAll=t.checked; $('#reg').innerHTML=regTable(); return; }
  if(t.dataset.calday!==undefined){ const c=getCal(); if(t.checked) c.giorni[t.dataset.calday]=c.giorni[t.dataset.calday]||''; else delete c.giorni[t.dataset.calday]; saveCal(c);
    const box=t.closest('.dayopt'); box.classList.toggle('on',t.checked); box.querySelector('input[type=time]').disabled=!t.checked; return; }
  if(t.dataset.caltime!==undefined){ const c=getCal(); if(c.giorni[t.dataset.caltime]!==undefined){ c.giorni[t.dataset.caltime]=t.value; saveCal(c); } return; }
  if(t.dataset.cal){ const c=getCal(); c[t.dataset.cal]= t.type==='checkbox' ? t.checked : t.value; saveCal(c); return; }
  if(t.dataset.iscr){ const a=getAt(t.dataset.iscr); if(!a) return; a.iscritto=t.checked; a.updatedAt=Date.now();
    persist.ath(a).then(()=>{ render(); toast(a.iscritto?'Segnato come iscritto':'Segnato come non iscritto'); })
      .catch(err=>{ a.iscritto=!t.checked; t.checked=a.iscritto; saveFail(err); }); }
  if(t.dataset.po){ ui.printOpts[t.dataset.po]=t.checked; }
  if(t.closest('#ex-form-edit') && !t.closest('.sed')) markDirty();
});
function autoGrow(t){ if(t.tagName!=='TEXTAREA') return; t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }

/* trascinamento delle voci nel programma */
let dragUid=null;
document.addEventListener('mousedown', e=>{ const h=e.target.closest('.handle'); const it=h&&h.closest('.item'); if(it) it.draggable=true; });
document.addEventListener('mouseup', ()=>{ $$('.item[draggable=true]').forEach(x=>{ if(!dragUid) x.draggable=false; }); });
document.addEventListener('dragstart', e=>{ const it=e.target.closest?.('.item[data-uid]'); if(!it) return; dragUid=it.dataset.uid; it.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragUid); }catch(_){} });
document.addEventListener('dragover', e=>{ if(!dragUid) return; const it=e.target.closest('.item[data-uid]'); $$('.item').forEach(x=>x.classList.remove('drop-before','drop-after')); if(!it||it.dataset.uid===dragUid) return; e.preventDefault(); const r=it.getBoundingClientRect(); it.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after'); });
document.addEventListener('drop', e=>{
  if(!dragUid) return; const it=e.target.closest('.item[data-uid]'); if(!it) return; e.preventDefault();
  const s=getSess(ui.sessId); const r=it.getBoundingClientRect(); const after=e.clientY>=r.top+r.height/2;
  const from=s.items.findIndex(x=>x.uid===dragUid); const [m]=s.items.splice(from,1);
  let to=s.items.findIndex(x=>x.uid===it.dataset.uid); if(after) to++;
  s.items.splice(to,0,m); dragUid=null; touchSess(s,'items');
});
document.addEventListener('dragend', ()=>{ dragUid=null; $$('.item').forEach(x=>{ x.classList.remove('dragging','drop-before','drop-after'); x.draggable=false; }); });

/* app installabile: funzionamento senza rete e aggiornamenti */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    const offer=w=>{
      if(document.querySelector('.update-bar')) return;
      const bar=document.createElement('div'); bar.className='update-bar';
      bar.innerHTML='È disponibile una nuova versione dell\'app <button class="btn sm primary">Aggiorna</button>';
      bar.querySelector('button').onclick=()=>{ if(ui.dirty && !confirm('Ci sono modifiche non salvate. Aggiornare lo stesso?')) return; flushPending(); w.postMessage('skipWaiting'); };
      document.body.appendChild(bar);
    };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', ()=>{ const w=reg.installing; w && w.addEventListener('statechange', ()=>{ if(w.state==='installed' && navigator.serviceWorker.controller) offer(w); }); });
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
  }).catch(e=>console.warn('Service worker non registrato', e));
  let reloaded=false; const hadController=!!navigator.serviceWorker.controller;   // al primo avvio non serve ricaricare
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(reloaded || !hadController) return; reloaded=true; location.reload(); });
}
